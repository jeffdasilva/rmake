[workspace]
members = ["crates/rmake", "crates/rmake-core", "crates/rmake-linux"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/jeffdasilva/rmake"
authors = ["Jeff DaSilva"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
