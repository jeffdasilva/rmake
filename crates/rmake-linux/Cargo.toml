[package]
name = "rmake-linux"
description = "Linux effect adapters for rmake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
guile = []

[[test]]
name = "guile_dispatcher"
path = "tests/guile_dispatcher.rs"
harness = false
required-features = ["guile"]

[build-dependencies]
cc = "=1.10.0"

[dependencies]
rmake-core = { path = "../rmake-core" }
stacker = "=0.1.25"

# Semantic and application crates retain the workspace-wide forbid. Only the
# private stdio and POSIX adapters may contain reviewed FFI.
[lints.rust]
unsafe_code = "deny"

