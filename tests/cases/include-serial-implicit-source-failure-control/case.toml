id = "include-serial-implicit-source-failure-control"
requirement = "includes.remake"
candidate = "required"
description = "A failed implicit source recipe remains a required failure under keep-going."
provenance = "Original rmake differential fixture; no upstream implementation or tests copied."
args = ["-rR", "--no-print-directory", "-j1", "-k", "all"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = "READ:0:old:Makefile worker.inc payload.mk\nWORKER\nREMAKE:payload.mk:trigger\n"
stderr = "make: *** [Makefile:16: payload.mk] Error 1\nMakefile:9: Failed to remake makefile 'payload.mk'.\n"
