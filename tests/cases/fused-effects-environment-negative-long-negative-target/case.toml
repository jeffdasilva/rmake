id = "fused-effects-environment-negative-long-negative-target"
requirement = "performance.runtime-flag-inspection"
candidate = "required"
args = ["-rR", "--no-print-directory", "--no-silent", "-S", "-Otarget"]
timeout_seconds = 5
output = "separate"
description = "Original recipe echo, keep-going, switch origin, alias and output-mode regression control for runtime parsing."
