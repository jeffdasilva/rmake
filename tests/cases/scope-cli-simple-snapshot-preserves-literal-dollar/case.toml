id = "scope-cli-simple-snapshot-preserves-literal-dollar"
requirement = "scope.target-specific"
candidate = "required"
description = "A target snapshot of a simple command-line binding retains literal dollars."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "X:=$$(Y)"]
