id = "initial-flags-makeflags-warning-position-before"
requirement = "cli.initial-expansion"
candidate = "required"
args = ["--no-print-directory"]
timeout_seconds = 5
description = "Initial warning policy follows its source and argument position."
provenance = "Independent exact status/stream model checked against two bounded GNU observations and candidate. No upstream source or tests copied."

[environment]
"MAKEFLAGS" = "$(info EARLY)--warn-undefined-variables X:=$$(MISSING)"

