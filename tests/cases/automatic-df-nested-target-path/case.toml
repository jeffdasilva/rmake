id = "automatic-df-nested-target-path"
requirement = "automatic.derivatives"
candidate = "required"
description = "Nested target paths are split into a directory without a trailing slash and the final component."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "target=<build/nested/output>\ndirectory=<build/nested>\nfilename=<output>\n"
stderr = ""
