id = "scope-private-target-value"
requirement = "scope.target-specific"
candidate = "required"
description = "A private target value is visible in its recipe but does not replace the global value in prerequisites."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=global/file\nparent=private/file\n"
stderr = ""
