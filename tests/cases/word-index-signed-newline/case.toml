id = "word-index-signed-newline"
requirement = "functions.words"
candidate = "required"
description = "word preserves an embedded newline in an invalid signed-index diagnostic."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"I" = "-\n2"

[expected]
exit_code = 2
stdout_hex = ""
stderr_hex = "4d616b6566696c653a343a202a2a2a20696e76616c696420666972737420617267756d656e7420746f2027776f7264272066756e6374696f6e3a20272d0a32272e202053746f702e0a"
