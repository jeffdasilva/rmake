id = "oneshell-config-expanded-under-dry"
requirement = "recipes.oneshell"
candidate = "required"
description = "Configuration expansion occurs before unforced dry mode skips process execution."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-n"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "Makefile:5: *** Recursive variable 'LOOP' references itself (eventually).  Stop.\n"
