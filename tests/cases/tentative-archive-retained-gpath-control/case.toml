id = "tentative-archive-retained-gpath-control"
requirement = "scope.target-eager-latest-parent"
candidate = "required"
description = "Keep the resolved recipe spelling when GPATH chooses a permanent archive rename."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "bundle", "move", "bundle(member)", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "redo=[src/bundle|member]\nraw=[||undefined|undefined||]\nsearched=[bundle|inherited-source|override|recursive|inherited-$(V)|source]\n"
stderr = ""
