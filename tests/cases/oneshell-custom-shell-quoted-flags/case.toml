id = "oneshell-custom-shell-quoted-flags"
requirement = "recipes.oneshell"
candidate = "required"
description = "Double-quoted shell-flag syntax preserves the oracle shell-dispatch argv shape."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "argc=4\narg=</bin/sh>\narg=<-c>\narg=<one \"two words\">\narg=<first\nsecond>\n"
stderr = ""
