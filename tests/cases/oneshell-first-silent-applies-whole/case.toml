id = "oneshell-first-silent-applies-whole"
requirement = "recipes.oneshell"
candidate = "required"
description = "A first-line silent modifier suppresses command echo for the complete script."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "first\nsecond\n"
stderr = ""
