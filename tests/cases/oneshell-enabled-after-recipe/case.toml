id = "oneshell-enabled-after-recipe"
requirement = "recipes.oneshell"
candidate = "required"
description = "A later .ONESHELL declaration enables combined execution for earlier parsed recipes."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "later\n"
stderr = ""
