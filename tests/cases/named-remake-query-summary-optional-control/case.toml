id = "named-remake-query-summary-optional-control"
requirement = "includes.named-remake-mode"
candidate = "required"
description = "An optional queried source still reports its retained error when explicitly requested"
provenance = "Original rmake regression independently authored against GNU Make 4.4.1."
args = ["-rR", "--no-print-directory", "-n", "all", "b.mk"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = "echo all\n"
stderr = "make: *** No rule to make target 'b.mk'.  Stop.\n"
