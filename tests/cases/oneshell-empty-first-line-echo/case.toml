id = "oneshell-empty-first-line-echo"
requirement = "recipes.oneshell"
candidate = "required"
description = "An empty first stored recipe line prevents later silent modifiers from suppressing complete-script echo."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "\nprintf '%s\\n' body\nbody\n"
stderr = ""
