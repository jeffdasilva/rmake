id = "scope-pattern-simple-deferred-append-effect-once"
requirement = "scope.pattern-specific"
candidate = "required"
description = "Deferred pattern simple append effects run once even when the completed value is expanded repeatedly."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "append=$(KEEP)\n<$(KEEP) $(LATE)>/<$(KEEP) $(LATE)>/simple\n"
stderr = ""
