id = "scope-pattern-unexport-inherited-by-child-replacement"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A child target replacement inherits the unexport policy of a matching parent pattern."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "leaf=<child>/<unset>\na.t=<pattern>/<unset>\n"
stderr = ""
