id = "scope-append-global-simple"
requirement = "scope.target-specific"
candidate = "required"
description = "A first target append is a recursive overlay over a global simple value and stores only its own RHS."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "expanded=base-early tail-late\nraw=tail-$(K)\nflavor=recursive\n"
stderr = ""
