id = "scope-pattern-simple-deferred-append-literal-dollars"
requirement = "scope.pattern-specific"
candidate = "required"
description = "Deferred append to a simple pattern binding preserves resulting literal dollar bytes."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "<$(KEEP) $(LATE)-$literal>/<$(KEEP) $(LATE)-$literal>/simple\n"
stderr = ""
