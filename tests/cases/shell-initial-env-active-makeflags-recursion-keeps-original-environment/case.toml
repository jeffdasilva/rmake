id = "shell-initial-env-active-makeflags-recursion-keeps-original-environment"
requirement = "shell.initial-environment"
candidate = "required"
description = "Active makeflags recursion keeps original environment."
provenance = "Original rmake fixture with a literal shell execution and child environment journal."
args = ["-rR", "--no-print-directory", "EAGER:=$(shell /usr/bin/python3 -B witness.py argv)"]
timeout_seconds = 4

[environment]
SHELL = "/bin/sh"
MAKEFLAGS = "$(shell /usr/bin/python3 -B witness.py fallback)-s"

[expected]
exit_code = 2
stdout = ""
stderr = "Makefile:2: *** reader stop.  Stop.\n"
