id = "scope-recursive-simple-timing"
requirement = "scope.target-specific"
candidate = "required"
description = "Simple target RHS expands when parsed while recursive target RHS sees later local values."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "simple=early/simple\nrecursive=target/recursive\nbase=target\n"
stderr = ""
