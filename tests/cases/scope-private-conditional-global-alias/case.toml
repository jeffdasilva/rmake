id = "scope-private-conditional-global-alias"
requirement = "scope.target-specific"
candidate = "required"
description = "A private conditional target declaration can mark an existing global binding private."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "parse=global/file\nparent=/undefined\nunrelated=/undefined\n"
stderr = ""
