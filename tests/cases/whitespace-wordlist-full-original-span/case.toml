id = "whitespace-wordlist-full-original-span"
requirement = "functions.words"
candidate = "required"
description = "wordlist preserves all six C-whitespace bytes inside the selected span while discarding outer separators."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b \talpha\t\n\r\f\u000bbeta\u000b \talpha\f\r "

[expected]
exit_code = 0
stdout_hex = "3c616c706861090a0d0c0b626574610b2009616c7068613e0a"
stderr_hex = ""
