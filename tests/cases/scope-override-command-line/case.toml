id = "scope-override-command-line"
requirement = "scope.target-specific"
candidate = "pending"
description = "Target override assignment outranks a command-line value and is inherited only below that target."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "X=cli"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=forced/override\nparent=forced/override\nother=cli/command line\n"
stderr = ""
