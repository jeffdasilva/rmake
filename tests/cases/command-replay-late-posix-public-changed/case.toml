id = "command-replay-late-posix-public-changed"
requirement = "variables.command-line-replay"
candidate = "required"
description = "Replay the already published public suffix before publishing the POSIX command-variable snapshot."
provenance = "Original rmake fixture, independently qualified against pinned GNU Make."
args = ["--no-builtin-rules", "--no-builtin-variables", "--keep-going", "--no-print-directory", "--jobs=1", "MARK=from-cli", "all"]
timeout_seconds = 5

[expected]
exit_code = 0
stderr = ""
stdout = '''
ENTRY|command line|from-cli|krR -j1 --no-print-directory -- $(MAKEOVERRIDES)|
READ|undefined||krRs -j1 --no-print-directory -- $(MAKEOVERRIDES)|
ALIAS|run|undefined
RUN|environment|from-public|environment|undefined|krRs -j1 --no-print-directory -- $(-*-command-variables-*-)
ENV|krRs -j1 --no-print-directory -- MARK=from-cli
'''
