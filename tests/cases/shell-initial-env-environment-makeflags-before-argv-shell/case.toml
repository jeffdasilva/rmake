id = "shell-initial-env-environment-makeflags-before-argv-shell"
requirement = "shell.initial-environment"
candidate = "required"
description = "Environment makeflags before argv shell."
provenance = "Original rmake fixture with a literal shell execution and child environment journal."
args = ["-rR", "--no-print-directory", "EAGER:=$(shell /usr/bin/python3 -B witness.py argv)"]
timeout_seconds = 4

[environment]
SHELL = "/bin/sh"
MAKEFLAGS = "$(shell /usr/bin/python3 -B witness.py inherited)-s"

[expected]
exit_code = 2
stdout = ""
stderr = "Makefile:2: *** reader stop.  Stop.\n"
