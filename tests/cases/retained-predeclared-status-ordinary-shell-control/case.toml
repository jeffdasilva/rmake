id = "retained-predeclared-status-ordinary-shell-control"
requirement = "scope.secondary-retained"
candidate = "required"
description = "Keep the override from a shell in the immediate right-hand side of an ordinary assignment."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "parent", "after"]
timeout_seconds = 4

[expected]
