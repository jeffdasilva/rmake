id = "scope-assignment-semicolon-literal"
requirement = "scope.target-specific"
candidate = "required"
description = "A semicolon inside a target assignment remains part of its value."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "first;second\n"
stderr = ""
