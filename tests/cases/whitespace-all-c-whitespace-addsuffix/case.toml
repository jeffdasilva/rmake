id = "whitespace-all-c-whitespace-addsuffix"
requirement = "functions.paths"
candidate = "required"
description = "addsuffix applies the suffix to every C-whitespace-delimited word."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b \talpha\t\n\r\f\u000bbeta\u000b \talpha\f\r "
"P" = "a%\u000bb%"

[expected]
exit_code = 0
stdout_hex = "3c616c7068612d706f737420626574612d706f737420616c7068612d706f73743e0a"
stderr_hex = ""
