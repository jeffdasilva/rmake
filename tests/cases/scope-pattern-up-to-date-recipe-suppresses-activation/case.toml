id = "scope-pattern-up-to-date-recipe-suppresses-activation"
requirement = "scope.pattern-specific"
candidate = "required"
description = "An up-to-date target does not initialize matching pattern effects merely because it has a recipe."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "make: Nothing to be done for 'all'.\n"
stderr = ""
