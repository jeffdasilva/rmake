id = "direct-double-head-later-write"
requirement = "scope.target-eager-retained"
candidate = "required"
description = "A later branch's named write updates the head seen by its own fallback and subsequent branches."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "parent", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "now=[parent|input|input|7|visible|]\nnow=[parent|other|other|7|visible|]\neager=[parent|input|input|19|visible|]\nnow=[parent|other|other|19|visible|]\nnow=[parent|third|third|19|visible|]\neager=[parent|input|input|19|visible|]\n"
stderr = ""
