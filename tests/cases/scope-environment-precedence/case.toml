id = "scope-environment-precedence"
requirement = "scope.target-specific"
candidate = "required"
description = "Ordinary target assignments outrank the environment in their subtree and leave siblings unchanged."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
X = "environment"

[expected]
exit_code = 0
stdout = "child=target/file\nparent=target/file\nother=environment/environment\n"
stderr = ""
