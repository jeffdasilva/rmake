id = "scope-pattern-repeated-goals-activate-once"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A repeated requested target initializes pattern effects and executes its recipe only once."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "a.t", "a.t"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "activate\nrecipe=base tail\nmake: 'a.t' is up to date.\n"
stderr = ""
