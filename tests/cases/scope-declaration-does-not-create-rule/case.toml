id = "scope-declaration-does-not-create-rule"
requirement = "scope.target-specific"
candidate = "required"
description = "A variable-only target declaration does not supply a build rule."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "ghost"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "make: *** No rule to make target 'ghost'.  Stop.\n"
