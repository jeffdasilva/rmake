id = "scope-shell-private-restores-default-child"
requirement = "scope.target-specific"
candidate = "required"
description = "A private target SHELL leaves descendant recipes using the global shell."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=sh\nall=bash\n"
stderr = ""
