id = "scope-append-global-recursive"
requirement = "scope.target-specific"
candidate = "pending"
description = "A target append includes a global recursive value and expands each part using the target context."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=global-target local-target\nparent=global-target local-target\n"
stderr = ""
