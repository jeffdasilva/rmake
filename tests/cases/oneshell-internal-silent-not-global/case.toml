id = "oneshell-internal-silent-not-global"
requirement = "recipes.oneshell"
candidate = "required"
description = "An internal silent modifier is removed but cannot silence command echo for the complete script."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "printf '%s\\n' first\nprintf '%s\\n' second\nfirst\nsecond\n"
stderr = ""
