id = "scope-export-local-does-not-leak-sibling"
requirement = "scope.target-specific"
candidate = "required"
description = "A target export binding does not alter an unrelated target environment."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "red=red/red\nblue=global/unset\n"
stderr = ""
