id = "scope-multiple-target-simple-per-context"
requirement = "scope.target-specific"
candidate = "required"
description = "Simple assignments evaluate separately in each target existing context."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "assign=red\nassign=blue\nred=value-red\nblue=value-blue\n"
stderr = ""
