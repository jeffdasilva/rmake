id = "oneshell-heredoc-internal-modifiers"
requirement = "recipes.oneshell"
candidate = "required"
description = "Bourne-shell internal prefix stripping also transforms a here-document body before shell execution."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "body\n"
stderr = ""
