id = "oneshell-errexit-ignore-option"
requirement = "recipes.oneshell"
candidate = "required"
description = "The -i option ignores the one shell outcome but does not disable shell errexit."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-i"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = ""
stderr = "make: [Makefile:7: all] Error 1 (ignored)\n"
