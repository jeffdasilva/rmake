id = "late-gpath-merged-immediate-recursive-status"
requirement = "scope.target-eager-latest-parent"
candidate = "required"
description = "Preserve the immediate recursive status and its later declaration slot during a searched rename."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "src/parent", "parent", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "completed|src/parent|dst.in|\nscope=[src/parent||dst.in|dst.in|source-$literal|override|recursive|source-$$literal|destination]\nenv=[.SHELLSTATUS|source-$literal ANCHOR_3190|source]\n"
stderr = "Makefile:15: Recipe was specified for file 'parent' at Makefile:15,\nMakefile:15: but 'parent' is now considered the same file as 'src/parent'.\nMakefile:15: Recipe for 'parent' will be ignored in favor of the one for 'src/parent'.\n"
