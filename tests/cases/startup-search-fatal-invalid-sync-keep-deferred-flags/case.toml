id = "startup-search-fatal-invalid-sync-keep-deferred-flags"
requirement = "startup.second-include-search"
candidate = "required"
timeout_seconds = 5
output = "separate"
description = "Original startup HOME second lookup, deferred flags, raw spelling/bytes, warning, callback, error, fallback or metadata control."
provenance = "Independent models qualified against two bounded pinned GNU Make 4.4.1 observations and frozen builds. No GNU implementation or tests copied or translated."
args = ["-rR", "--no-print-directory", "-s", "-k", "HOME=$(file >>seen,HOME)~", "-I~/inc", "HOME=$(file >>seen,LATE)$(eval MAKEFLAGS = -Obad)$(file >>seen,FORBIDDEN)hdir"]

[environment]
"GNUMAKEFLAGS" = ""

[expected]
"exit_code" = 2
"stdout_hex" = ""
"stderr_hex" = "6d616b653a202a2a2a20756e6b6e6f776e206f75747075742d73796e6320747970652027626164272e202053746f702e0a"
