id = "scope-recursive-automatic-context"
requirement = "scope.target-specific"
candidate = "required"
description = "An inherited recursive target RHS expands automatic variables in the recipe currently being executed."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=child/\nparent=all/child\n"
stderr = ""
