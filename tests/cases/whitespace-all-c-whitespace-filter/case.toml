id = "whitespace-all-c-whitespace-filter"
requirement = "functions.text"
candidate = "required"
description = "filter tokenizes both its patterns and input with C-locale ASCII whitespace."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b \talpha\t\n\r\f\u000bbeta\u000b \talpha\f\r "
"P" = "a%\u000bb%"

[expected]
exit_code = 0
stdout_hex = "3c616c706861206265746120616c7068613e0a"
stderr_hex = ""
