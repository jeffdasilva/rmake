id = "oneshell-dry-run-unforced"
requirement = "recipes.oneshell"
candidate = "required"
description = "Dry-run prints the transformed complete script once and executes no commands."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-n"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "printf '%s\\n' first\nprintf '%s\\n' second\n"
stderr = ""
