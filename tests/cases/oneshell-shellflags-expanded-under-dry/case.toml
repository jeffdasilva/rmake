id = "oneshell-shellflags-expanded-under-dry"
requirement = "recipes.oneshell"
candidate = "required"
description = "The shell flags expression is expanded before dry mode skips invocation."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-n"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "Makefile:7: *** unterminated variable reference.  Stop.\n"
