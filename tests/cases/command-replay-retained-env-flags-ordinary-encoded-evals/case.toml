id = "command-replay-retained-env-flags-ordinary-encoded-evals"
requirement = "variables.command-line-replay"
candidate = "required"
description = "An ordinary losing replacement processes the retained override after two escaped eval options in the same flag string."
provenance = "Original rmake fixture, independently qualified against pinned GNU Make."
args = ["--no-builtin-rules", "--no-builtin-variables", "--keep-going", "--no-print-directory", "--jobs=1", "--environment-overrides", "--eval=EARLY := kept --", "--eval=EARLY += later --", "MARK=from-cli", "all"]
timeout_seconds = 5

[expected]
exit_code = 0
stderr = ""
stdout = '''
ENTRY|command line|from-cli|ekrR -j1 --no-print-directory $(-*-eval-flags-*-) -- $(MAKEOVERRIDES)|kept -- later --
ALIAS|read|undefined
READ|file|from-public|ekrR -j1 --no-print-directory $(-*-eval-flags-*-) -- $(MAKEOVERRIDES)|kept -- later --
ALIAS|run|file
RUN|environment override|from-public|environment override|file|ekrR -j1 --no-print-directory $(-*-eval-flags-*-) -- $(MAKEOVERRIDES)
ALIAS|run|environment override
ENV|ekrR -j1 --no-print-directory --eval=EARLY\ :=\ kept\ -- --eval=EARLY\ +=\ later\ -- -- MARK=from-public SIDE=environment override
'''
