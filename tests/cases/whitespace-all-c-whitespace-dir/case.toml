id = "whitespace-all-c-whitespace-dir"
requirement = "functions.paths"
candidate = "required"
description = "dir splits every C-whitespace-delimited filename and supplies ./ for bare names."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000bdir/a.c\t\n\r\f\u000bplain.rs\u000blast.txt \u000b"

[expected]
exit_code = 0
stdout_hex = "3c6469722f202e2f202e2f3e0a"
stderr_hex = ""
