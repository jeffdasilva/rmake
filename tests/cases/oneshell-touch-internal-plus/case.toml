id = "oneshell-touch-internal-plus"
requirement = "recipes.oneshell"
candidate = "required"
description = "An internal plus modifier does not force execution in touch mode."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-t"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "touch all\n"
stderr = ""
