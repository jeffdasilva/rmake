id = "automatic-df-prerequisite-lists"
requirement = "automatic.derivatives"
candidate = "required"
description = "Directory and filename forms retain duplicate-directory positions, while + preserves repeated prerequisites and ^ removes duplicate names."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "first=<.>/<a>\nunique=<. p p>/<a b c>\nrepeated=<. p . p>/<a b a c>\nnewer=<. p p>/<a b c>\norder=<order>\n"
stderr = ""
