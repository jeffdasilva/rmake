id = "whitespace-all-c-whitespace-patsubst-literal"
requirement = "functions.text"
candidate = "required"
description = "Literal patsubst preserves exact surrounding and interior whitespace while replacing whole words."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b \talpha\t\n\r\f\u000bbeta\u000b \talpha\f\r "
"P" = "a%\u000bb%"

[expected]
exit_code = 0
stdout_hex = "3c0b20097265706c61636564090a0d0c0b626574610b20097265706c616365640c0d203e0a"
stderr_hex = ""
