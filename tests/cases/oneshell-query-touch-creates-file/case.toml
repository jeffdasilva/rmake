id = "oneshell-query-touch-creates-file"
requirement = "recipes.oneshell"
candidate = "required"
description = "Combined query and touch creates the target and returns success without recipe expansion."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-q", "-t"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "touch all\n"
stderr = ""
