id = "scope-export-private-parent-restores-global-child"
requirement = "scope.target-specific"
candidate = "required"
description = "Skipping a private parent binding restores the exported global value for descendants."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=global/global\nall=parent/parent\n"
stderr = ""
