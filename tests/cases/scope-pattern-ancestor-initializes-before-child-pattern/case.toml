id = "scope-pattern-ancestor-initializes-before-child-pattern"
requirement = "scope.pattern-specific"
candidate = "required"
description = "Deferred ancestor pattern effects initialize before matching descendant pattern effects."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "parent-activate\nchild-activate\nchild.t=parent tail/child tail\nparent.t=parent tail/\n"
stderr = ""
