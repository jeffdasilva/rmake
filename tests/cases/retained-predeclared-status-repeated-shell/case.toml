id = "retained-predeclared-status-repeated-shell"
requirement = "scope.secondary-retained"
candidate = "required"
description = "Reuse one predeclared status slot across a shell, named override, and another shell."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "parent", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "status=[parent|accepted|override|simple|accepted]\nstatus=[parent|37|override|simple|37]\nenv=[.SHELLSTATUS|37 ANCHOR_3190|before ANCHOR_4413|after]\n"
stderr = ""
