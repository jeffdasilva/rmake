id = "scope-pattern-missing-target-does-not-activate-fatal-append"
requirement = "scope.pattern-specific"
candidate = "required"
description = "An unbuildable target does not activate a matching deferred pattern append with a fatal effect."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "make: *** No rule to make target 'missing.t', needed by 'all'.  Stop.\n"
