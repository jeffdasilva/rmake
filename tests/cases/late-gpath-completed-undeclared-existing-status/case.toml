id = "late-gpath-completed-undeclared-existing-status"
requirement = "scope.target-eager-latest-parent"
candidate = "required"
description = "Keep the completed destination status and insert a competing later export."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "src/parent", "parent", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "dest|src/parent|dest.in|23\nscope=[src/parent||dest.in|dest.in|23|override||undefined||]\nenv=[.SHELLSTATUS|23 ANCHOR_3190|source ANCHOR_4413|later]\n"
stderr = "Makefile:13: Recipe was specified for file 'parent' at Makefile:13,\nMakefile:13: but 'parent' is now considered the same file as 'src/parent'.\nMakefile:13: Recipe for 'parent' will be ignored in favor of the one for 'src/parent'.\n"
