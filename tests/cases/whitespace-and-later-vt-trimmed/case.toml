id = "whitespace-and-later-vt-trimmed"
requirement = "functions.control"
candidate = "required"
description = "and trims a later literal vertical-tab argument to an empty result."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout_hex = "3c3e0a"
stderr_hex = ""
