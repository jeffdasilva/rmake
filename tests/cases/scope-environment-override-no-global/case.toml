id = "scope-environment-override-no-global"
requirement = "scope.target-specific"
candidate = "required"
description = "Without a global assignment collision, -e leaves the imported origin unchanged and a target assignment wins."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-e"]
timeout_seconds = 5

[environment]
X = "environment"

[expected]
exit_code = 0
stdout = "child=target/file\nparent=target/file\n"
stderr = ""
