id = "word-index-cli-recursive-recipe-location"
requirement = "functions.words"
candidate = "required"
description = "A failing word expression in a command-line variable inherits its recipe expansion location."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "BROKEN=$(word bad,alpha beta)"]
timeout_seconds = 5

