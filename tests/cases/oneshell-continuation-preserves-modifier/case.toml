id = "oneshell-continuation-preserves-modifier"
requirement = "recipes.oneshell"
candidate = "required"
description = "An escaped newline keeps a following internal modifier while an ordinary newline permits modifier stripping."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "argc=2\narg=<-c>\narg=<first \\\n@second\nthird>\n"
stderr = ""
