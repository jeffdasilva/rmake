id = "scope-pattern-declaration-no-rule"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A pattern variable declaration alone does not provide an implicit rule."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "make: *** No rule to make target 'missing.task', needed by 'all'.  Stop.\n"
