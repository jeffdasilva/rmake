id = "startup-search-metadata-keep-target-short-deferred-flags"
requirement = "startup.second-include-search"
candidate = "required"
timeout_seconds = 5
output = "separate"
description = "Original startup HOME second lookup, deferred flags, raw spelling/bytes, warning, callback, error, fallback or metadata control."
provenance = "Independent models qualified against two bounded pinned GNU Make 4.4.1 observations and frozen builds. No GNU implementation or tests copied or translated."
args = ["--no-print-directory", "-r", "-Otarget", "-I$(if $(value READY),literal,$(file >>seen,META)$(eval READY:=yes)$(eval MAKEFLAGS = --keep-going)literal)"]

[environment]
"GNUMAKEFLAGS" = ""

[expected]
"exit_code" = 2
"stdout_hex" = "66616c73650a"
"stderr_hex" = "6d616b653a202a2a2a205b4d616b6566696c653a343a2066697273745d204572726f7220310a"
