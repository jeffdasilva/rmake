id = "whitespace-let-tail-preserves-trailing-separators"
requirement = "functions.control"
candidate = "required"
description = "The final let binding retains exact interior and trailing C-whitespace bytes."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"V" = " \u000bone\ttwo\u000bthree \f\u000b"

[expected]
exit_code = 0
stdout_hex = "3c5b6f6e655d2f5b74776f0b7468726565200c0b5d3e0a"
