id = "scope-environment-collision-after-local"
requirement = "scope.target-specific"
candidate = "required"
description = "A later global environment-override collision does not replace a prior local binding."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-e"]
timeout_seconds = 5

[environment]
X = "environment"

[expected]
exit_code = 0
stdout = "local/file\n"
stderr = ""
