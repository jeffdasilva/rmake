id = "scope-pattern-cli-snapshot-survives-undefine"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A pattern command-line snapshot survives a later override undefine of the global binding."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "X=cli"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "<cli>/command line/recursive\n"
stderr = ""
