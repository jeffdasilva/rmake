id = "scope-shellflags-local-child-failure"
requirement = "scope.target-specific"
candidate = "required"
description = "Inherited target .SHELLFLAGS affect the prerequisite shell and retain the recipe error location."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "make: *** [Makefile:8: child] Error 1\n"
