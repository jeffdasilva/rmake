id = "retained-predeclared-status-merge-destination-control"
requirement = "scope.target-eager-latest-parent"
candidate = "required"
description = "Keep the completed destination slot and its unexport policy when both files declared status."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "src/parent", "parent", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "completed|src/parent|dst.in|23\nscope=[src/parent||dst.in|dst.in|23|override|simple|23|destination]\nenv=[]\n"
stderr = "Makefile:15: Recipe was specified for file 'parent' at Makefile:15,\nMakefile:15: but 'parent' is now considered the same file as 'src/parent'.\nMakefile:15: Recipe for 'parent' will be ignored in favor of the one for 'src/parent'.\n"
