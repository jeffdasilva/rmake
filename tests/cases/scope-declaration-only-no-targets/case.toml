id = "scope-declaration-only-no-targets"
requirement = "scope.target-specific"
candidate = "required"
description = "A Makefile containing only a target variable declaration has no default target."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "make: *** No targets.  Stop.\n"
