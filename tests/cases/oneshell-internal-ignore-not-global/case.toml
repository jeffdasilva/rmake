id = "oneshell-internal-ignore-not-global"
requirement = "recipes.oneshell"
candidate = "required"
description = "An internal ignore modifier is removed for sh but does not ignore the combined failure."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = "before\n"
stderr = "make: *** [Makefile:6: all] Error 6\n"
