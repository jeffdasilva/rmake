id = "whitespace-all-c-whitespace-suffix"
requirement = "functions.paths"
candidate = "required"
description = "suffix splits every C-whitespace-delimited filename before extracting suffixes."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000bdir/a.c\t\n\r\f\u000bplain.rs\u000blast.txt \u000b"

[expected]
exit_code = 0
stdout_hex = "3c2e63202e7273202e7478743e0a"
stderr_hex = ""
