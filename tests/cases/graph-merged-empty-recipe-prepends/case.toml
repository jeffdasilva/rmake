id = "graph-merged-empty-recipe-prepends"
requirement = "graph.merged-prerequisites"
candidate = "required"
description = "A declared empty recipe still makes its complete prerequisite block precede earlier declarations."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "visit=c\nvisit=d\nvisit=a\nvisit=b\n"
stderr = ""
