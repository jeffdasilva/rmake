id = "command-replay-simple-reference-data-hidden-first-operand"
requirement = "variables.command-line-replay"
candidate = "required"
description = "The hidden-looking operand remains literal when the option terminator starts the flag source."
provenance = "Original rmake fixture, independently qualified against pinned GNU Make."
args = ["--no-builtin-rules", "--no-builtin-variables", "--keep-going", "--no-print-directory", "--jobs=1", "MARK=from-cli", "all"]
timeout_seconds = 5

[expected]
exit_code = 0
stderr = ""
stdout = '''
ENTRY|command line|from-cli|krR -j1 --no-print-directory -- $(MAKEOVERRIDES)
READ|override|price$(-*-command-variables-*-)|override|published|simple|-- MARK=price$(-*-command-variables-*-) SIDE=published
RUN|override|price$(-*-command-variables-*-)|override|published|simple|-- MARK=price$(-*-command-variables-*-) SIDE=published
CONSUME-BEGIN
CONSUME|priceMARK=from-cli
ENV|-- MARK=price$(-*-command-variables-*-) SIDE=published|
'''
