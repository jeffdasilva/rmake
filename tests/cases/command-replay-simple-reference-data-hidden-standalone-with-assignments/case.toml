id = "command-replay-simple-reference-data-hidden-standalone-with-assignments"
requirement = "variables.command-line-replay"
candidate = "required"
description = "Standalone literal hidden reference text leaves the neighboring command assignments in effect."
provenance = "Original rmake fixture, independently qualified against pinned GNU Make."
args = ["--no-builtin-rules", "--no-builtin-variables", "--keep-going", "--no-print-directory", "--jobs=1", "MARK=from-cli", "all"]
timeout_seconds = 5

[expected]
exit_code = 0
stderr = ""
stdout = '''
ENTRY|command line|from-cli|krR -j1 --no-print-directory -- $(MAKEOVERRIDES)
READ|override|explicit|override|assigned|simple|--silent -- $(-*-command-variables-*-) MARK=explicit SIDE=assigned
RUN|override|explicit|override|assigned|simple|--silent -- $(-*-command-variables-*-) MARK=explicit SIDE=assigned
ENV|--silent -- $(-*-command-variables-*-) MARK=explicit SIDE=assigned|
'''
