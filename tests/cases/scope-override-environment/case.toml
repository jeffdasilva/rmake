id = "scope-override-environment"
requirement = "scope.target-specific"
candidate = "required"
description = "An explicit override target assignment outranks the environment even when -e is active."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-e"]
timeout_seconds = 5

[environment]
X = "environment"

[expected]
exit_code = 0
stdout = "child=forced/override\nparent=forced/override\n"
stderr = ""
