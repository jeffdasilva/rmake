id = "whitespace-all-six-separators-individual"
requirement = "functions.words"
candidate = "required"
description = "Space, tab, newline, vertical tab, form feed and carriage return each delimit two words."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"SP" = "a b"
"HT" = "a\tb"
"LF" = "a\nb"
"VT" = "a\u000bb"
"FF" = "a\fb"
"CR" = "a\rb"

[expected]
exit_code = 0
stdout_hex = "53503a323a5b6120625d0a48543a323a5b6120625d0a4c463a323a5b6120625d0a56543a323a5b6120625d0a46463a323a5b6120625d0a43523a323a5b6120625d0a"
stderr_hex = ""
