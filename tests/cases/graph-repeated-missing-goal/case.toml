id = "graph-repeated-missing-goal"
requirement = "graph.merged-prerequisites"
candidate = "required"
description = "Repeated explicit missing goals share the failed update outcome and emit one missing-rule diagnostic."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-k", "missing", "missing"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "make: *** No rule to make target 'missing'.\n"
