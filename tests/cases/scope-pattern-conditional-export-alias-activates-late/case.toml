id = "scope-pattern-conditional-export-alias-activates-late"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A suppressed conditional pattern export changes the global export policy for later unrelated targets."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "before=<global>/unset\na.t=<global>/global\nafter=<global>/global\n"
stderr = ""
