id = "graph-merged-normal-before-order"
requirement = "graph.merged-prerequisites"
candidate = "required"
description = "An order-only duplicate cannot demote an existing normal prerequisite or add another visit."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "visit=a\nvisit=b\nvisit=c\nauto=all|first=a|plus=a b|unique=a b|newer=a b|order=c\n"
stderr = ""
