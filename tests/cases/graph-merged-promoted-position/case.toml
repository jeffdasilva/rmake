id = "graph-merged-promoted-position"
requirement = "graph.merged-prerequisites"
candidate = "required"
description = "A duplicate normal occurrence promotes an earlier order-only occurrence without changing its visit position."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "visit=a\nvisit=b\nvisit=c\nauto=all|first=c|plus=c a|unique=a c|newer=a c|order=b\n"
stderr = ""
