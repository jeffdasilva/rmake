id = "scope-unexport-parent-policy-child-replacement"
requirement = "scope.target-specific"
candidate = "required"
description = "A child replacement inherits an ancestor unexport policy ahead of a global export policy."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=child/unset\nall=parent/unset\n"
stderr = ""
