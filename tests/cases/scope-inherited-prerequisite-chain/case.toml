id = "scope-inherited-prerequisite-chain"
requirement = "scope.target-specific"
candidate = "required"
description = "An explicit target value propagates through prerequisite levels and stays out of sibling goals."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "leaf=parent\nchild=parent\nparent=parent\nother=global\n"
stderr = ""
