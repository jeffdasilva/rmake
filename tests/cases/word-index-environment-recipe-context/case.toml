id = "word-index-environment-recipe-context"
requirement = "functions.words"
candidate = "required"
description = "A failing word expression imported from the environment inherits the recipe expansion location."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"BROKEN" = "$(word bad,alpha beta)"

[expected]
exit_code = 2
stdout_hex = ""
stderr_hex = "4d616b6566696c653a363a202a2a2a20696e76616c696420666972737420617267756d656e7420746f2027776f7264272066756e6374696f6e3a2027626164272e202053746f702e0a"
