id = "scope-pattern-private-specific-hides-general-from-child"
requirement = "scope.pattern-specific"
candidate = "required"
description = "Private metadata on the final matching pattern value hides earlier pattern values from descendants."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

