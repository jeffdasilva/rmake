id = "owned-home-byte-history-recursive-trailing"
requirement = "options.runtime-home-includes"
candidate = "required"
args = ["-rR", "--no-print-directory", "-s"]
timeout_seconds = 5
output = "separate"
description = "Original runtime HOME include operand, argument/effect order, raw-byte, warning, callback, parallel, ignored-operand or fatal control."
provenance = "Independent model qualified against two bounded pinned GNU Make 4.4.1 observations and frozen debug/optimized candidates. No GNU source or tests copied or translated."

[environment]
"GNUMAKEFLAGS" = ""

