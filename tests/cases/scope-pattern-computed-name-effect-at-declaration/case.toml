id = "scope-pattern-computed-name-effect-at-declaration"
requirement = "scope.pattern-specific"
candidate = "required"
description = "Computed pattern variable names expand once during declaration in global context."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "name=early\na.t=<value>/<>\nb.t=<value>/<>\n"
stderr = ""
