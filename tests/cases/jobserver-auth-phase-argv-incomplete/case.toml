id = "jobserver-auth-phase-argv-incomplete"
requirement = "parallel.jobserver"
candidate = "required"
description = "An incomplete descriptor pair receives the malformed diagnostic."
provenance = "Original rmake fixture; independently authored against pinned GNU behavior."
args = ["-rR", "--no-print-directory", "--jobserver-auth=181,"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "read=[rR -j1 --no-print-directory|-rR -j1 --no-print-directory]\nrun=[rR -j1 --no-print-directory|-rR -j1 --no-print-directory]\n"
stderr = "make: invalid --jobserver-auth string '181,'\nmake: warning: jobserver unavailable: using -j1.  Add '+' to parent make rule.\n"
