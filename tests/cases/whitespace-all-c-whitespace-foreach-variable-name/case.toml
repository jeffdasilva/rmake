id = "whitespace-all-c-whitespace-foreach-variable-name"
requirement = "functions.control"
candidate = "required"
description = "foreach skips C whitespace around its local variable name and uses automatic origin."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"NAME" = "\u000b\t x \f\u000b"

[expected]
exit_code = 0
stdout_hex = "3c5b6c6566745d2f5b6175746f6d617469635d205b72696768745d2f5b6175746f6d617469635d3e0a"
stderr_hex = ""
