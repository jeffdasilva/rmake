id = "automatic-df-order-only-remain-ordinary"
requirement = "automatic.derivatives"
candidate = "required"
description = "No automatic order-only D/F definitions exist, so user definitions remain ordinary and the undefined variant stays empty."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "order=order\ndirectory=authored/file/recursive\nfilename=<>/undefined/undefined\n"
stderr = ""
