id = "scope-shell-local-inherits-child"
requirement = "scope.target-specific"
candidate = "required"
description = "A target-local SHELL controls both its own recipe and inherited prerequisite recipes."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=bash\nall=bash\n"
stderr = ""
