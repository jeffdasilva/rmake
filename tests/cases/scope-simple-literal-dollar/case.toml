id = "scope-simple-literal-dollar"
requirement = "scope.target-specific"
candidate = "required"
description = "Simply expanded target values preserve a literal dollar both through expansion and the value function."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "child=<$literal>/<$literal>\nparent=<$literal>/<$literal>\n"
stderr = ""
