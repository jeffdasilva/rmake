id = "oneshell-quoted-internal-modifiers"
requirement = "recipes.oneshell"
candidate = "required"
description = "Bourne-shell internal prefix stripping is lexical, including inside a multiline quoted shell string."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "first\nmiddle\nlast\n"
stderr = ""
