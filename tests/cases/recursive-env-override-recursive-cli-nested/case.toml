id = "recursive-env-override-recursive-cli-nested"
requirement = "recursion.environment"
candidate = "required"
description = "Recursive command-variable origins survive environment override when GNU propagates them."
provenance = "Original rmake fixture; independently authored against pinned GNU behavior."
args = ["--no-print-directory", "-e", "V=cli words", "all"]
timeout_seconds = 8

[environment]
V = "initial"

[expected]
exit_code = 0
stdout = "parent command line:[cli words]\nchild command line:[cli words]\nleaf command line:[cli words]\n"
stderr = ""
