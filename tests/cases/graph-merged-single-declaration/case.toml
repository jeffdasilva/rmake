id = "graph-merged-single-declaration"
requirement = "graph.merged-prerequisites"
candidate = "required"
description = "A declaration visits normal then order-only prerequisites and keeps their automatic lists separate."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "visit=a\nvisit=b\nauto=all|first=a|plus=a|unique=a|newer=a|order=b\n"
stderr = ""
