id = "scope-environment-override-flag"
requirement = "scope.target-specific"
candidate = "pending"
description = "A global assignment collision under -e promotes the imported value and makes it outrank target assignments."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "-e"]
timeout_seconds = 5

[environment]
X = "environment"

[expected]
exit_code = 0
stdout = "child=environment/environment override\nparent=environment/environment override\n"
stderr = ""
