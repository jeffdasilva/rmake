id = "debug-makefile-loop-required-missing"
requirement = "debug.makefile-loop"
candidate = "required"
description = "Makefile remake preflight and verbose trace for required missing."
provenance = "Original rmake fixture; behavior researched in GNU Make 4.4.1 main.c and checked with its executable."
args = ["-rR", "--no-print-directory", "--debug=v", "all"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = "GNU Make 4.4.1\nBuilt for x86_64-pc-linux-gnu\nCopyright (C) 1988-2023 Free Software Foundation, Inc.\nLicense GPLv3+: GNU GPL version 3 or later <https://gnu.org/licenses/gpl.html>\nThis is free software: you are free to change and redistribute it.\nThere is NO WARRANTY, to the extent permitted by law.\nReading makefiles...\nReading makefile 'Makefile'...\nReading makefile 'absent.mk' (search path) (no ~ expansion)...\nUpdating makefiles....\nMakefile 'absent.mk' might loop; not remaking it.\n"
stderr = "Makefile:1: absent.mk: No such file or directory\n"
