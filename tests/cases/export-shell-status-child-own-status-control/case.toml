id = "export-shell-status-child-own-status-control"
requirement = "variables.export-bindings"
candidate = "required"
description = "Observe the child's environment ordering after an ordinary file-local shell completion."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "parent"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = ".SHELLSTATUS|11\nANCHOR_3190|named\n"
stderr = ""
