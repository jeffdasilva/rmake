id = "fs-file-dev-full-omitted-text"
requirement = "functions.file"
candidate = "required"
description = "An omitted write text opens and closes /dev/full successfully without attempting a write."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "success\n"
stderr = ""
