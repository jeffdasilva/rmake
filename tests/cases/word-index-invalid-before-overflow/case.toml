id = "word-index-invalid-before-overflow"
requirement = "functions.words"
candidate = "required"
description = "word reports invalid syntax when malformed text precedes an otherwise overflowing number."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"I" = "x9223372036854775808"

[expected]
exit_code = 2
stdout_hex = ""
stderr_hex = "4d616b6566696c653a343a202a2a2a20696e76616c696420666972737420617267756d656e7420746f2027776f7264272066756e6374696f6e3a20277839323233333732303336383534373735383038272e202053746f702e0a"
