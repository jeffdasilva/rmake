id = "whitespace-all-c-whitespace-let-names-values"
requirement = "functions.control"
candidate = "required"
description = "let splits names and individual values at C whitespace, preserving the last binding remainder."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"NAMES" = "a\u000bb\tc"
"VALUES" = "one\u000btwo\rthree\f four\u000bfive"

[expected]
exit_code = 0
stdout_hex = "3c5b6f6e655d2f5b74776f5d2f5b74687265650c20666f75720b666976655d3e0a"
stderr_hex = ""
