id = "span-let-one-name-empty-list-effects"
requirement = "functions.control"
candidate = "required"
description = "let safely binds one name to empty after scanning a whitespace-only list and preserves all effects."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = " \t\n\u000b\f\r "

[expected]
exit_code = 0
stdout_hex = "6e616d65730a76616c7565730a626f64790a3c5b5d3e0a"
stderr_hex = ""
