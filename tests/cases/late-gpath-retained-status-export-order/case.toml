id = "late-gpath-retained-status-export-order"
requirement = "scope.target-eager-latest-parent"
candidate = "required"
description = "Observe the saved file scope after a recipe creates a GPATH destination."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "parent", "after"]
timeout_seconds = 4

