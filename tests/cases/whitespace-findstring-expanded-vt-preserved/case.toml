id = "whitespace-findstring-expanded-vt-preserved"
requirement = "functions.text"
candidate = "required"
description = "findstring matches an expanded vertical-tab needle without tokenizing text."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"V" = "\u000b"
"W" = "a\u000bb"

[expected]
exit_code = 0
stdout_hex = "3c0b3e0a"
stderr_hex = ""
