id = "whitespace-let-more-names-than-words"
requirement = "functions.control"
candidate = "required"
description = "let assigns empty values to extra C-whitespace-delimited names."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"N" = "a\u000bb\u000bc"
"V" = "\u000bone\u000b"

[expected]
exit_code = 0
stdout_hex = "3c5b6f6e655d2f5b5d2f5b5d3e0a"
stderr_hex = ""
