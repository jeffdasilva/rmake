id = "process-enoexec-slash"
requirement = "process.invocation"
candidate = "required"
description = "An executable text file without a shebang uses /bin/sh with preserved arguments and exported environment."
provenance = "Original rmake fixture; independently checked with GNU Make 4.4.1, without copying upstream tests."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "name=<./plain-script> first=<two words> second=<literal> env=<slash-value> level=<1>\ncontinued\n"
stderr = ""
