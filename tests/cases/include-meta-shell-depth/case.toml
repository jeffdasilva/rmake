id = "include-meta-shell-depth"
requirement = "startup.constructor-metadata"
candidate = "required"
args = ["--no-print-directory", "-rR", "-I-", "-Idir-$(file >>observed,$(shell printf D$$MAKELEVEL))"]
timeout_seconds = 5
output = "separate"
description = "Original constructor visibility, evaluator, output ownership, directory or recursion phase control."
provenance = "Independently modeled inputs checked against two bounded pinned GNU Make 4.4.1 observations and both frozen builds. Qualified Linux parent-descriptor markers observe buffering; no normalization or upstream code/tests copied."

[environment]
"SHELL" = "/bin/sh"
"MAKELEVEL" = "3"

[expected]
exit_code = 0
stdout_hex = "5345454e3d5b44345d0a"
stderr_hex = ""
