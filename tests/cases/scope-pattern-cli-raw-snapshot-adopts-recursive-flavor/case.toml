id = "scope-pattern-cli-raw-snapshot-adopts-recursive-flavor"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A recursive pattern declaration reinterprets literal dollar bytes from a simple command-line snapshot."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "X:=$$(Y)"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "<later>/<$(Y)>/command line/recursive\n"
stderr = ""
