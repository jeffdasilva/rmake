id = "oneshell-errexit-first-location"
requirement = "recipes.oneshell"
candidate = "required"
description = "The -ec shell stops at the first failing command and diagnostics use the first stored recipe line."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = ""
stderr = "make: *** [Makefile:7: all] Error 1\n"
