id = "scope-pattern-recipe-less-ancestor-activates-for-child"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A recipe-less ancestor initializes its pattern values before they are inherited by a descendant recipe."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "activate\nchild=base tail\n"
stderr = ""
