id = "graph-special-silent-order-only"
requirement = "graph.merged-prerequisites"
candidate = "required"
description = "Order-only names on .SILENT silence only their named target rather than enabling global silence."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "quiet\nprintf '%s\\n' other\nother\n"
stderr = ""
