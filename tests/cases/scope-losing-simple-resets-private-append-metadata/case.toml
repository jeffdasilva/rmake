id = "scope-losing-simple-resets-private-append-metadata"
requirement = "scope.target-specific"
candidate = "required"
description = "A losing simple target assignment resets privacy and clears the inherited append marker."
provenance = "Independently minimized from original seeded dependency-graph scope testing against GNU Make 4.4.1; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "rhs=<outer tail>\nchild=<tail>/<tail>/override/recursive\nall=<tail>/<tail>/override/recursive\n"
stderr = ""
