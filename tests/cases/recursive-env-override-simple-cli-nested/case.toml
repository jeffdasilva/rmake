id = "recursive-env-override-simple-cli-nested"
requirement = "recursion.environment"
candidate = "required"
description = "Recursive command-variable origins survive environment override when GNU propagates them."
provenance = "Original rmake fixture; independently authored against pinned GNU behavior."
args = ["--no-print-directory", "-e", "V:=cli", "all"]
timeout_seconds = 8

[environment]
V = "initial"

[expected]
exit_code = 0
stdout = "parent command line:[cli]\nchild command line:[cli]\nleaf command line:[cli]\n"
stderr = ""
