id = "scope-pattern-cli-conditional-sees-later-override"
requirement = "scope.pattern-specific"
candidate = "required"
description = "A conditional pattern declaration does not snapshot a command-line binding before later global override."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory", "X=cli"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "<later>/override/recursive\n"
stderr = ""
