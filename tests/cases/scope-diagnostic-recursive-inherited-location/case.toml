id = "scope-diagnostic-recursive-inherited-location"
requirement = "scope.target-specific"
candidate = "required"
description = "Inherited recursive target warnings use the executing recipe source line."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "value\n"
stderr = "Makefile:7: runtime\n"
