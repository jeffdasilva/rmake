id = "live-debug-validation-command-line-eval"
requirement = "options.live-debug-validation"
candidate = "required"
args = ["-rR", "--no-print-directory", "--eval=$(info EVAL-START)\n$(file >>seen,EVAL-START)\nMAKEFLAGS := FIRST:=$$(file\\ >>seen,FIRST)$$(info\\ FIRST) --debug=z LAST:=$$(file\\ >>seen,LAST)$$(info\\ LAST)\n$(info EVAL-END)", "all"]
timeout_seconds = 5

[expected]
exit_code = 2
stdout = "EVAL-START\nFIRST\nLAST\n"
stderr = "make: *** unknown debug level specification 'z'.  Stop.\n"
