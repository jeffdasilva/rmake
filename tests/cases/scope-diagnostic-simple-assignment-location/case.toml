id = "scope-diagnostic-simple-assignment-location"
requirement = "scope.target-specific"
candidate = "required"
description = "Immediate target assignment warnings retain the target declaration source line."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "ready\n"
stderr = "Makefile:4: immediate\n"
