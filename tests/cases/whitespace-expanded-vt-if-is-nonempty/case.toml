id = "whitespace-expanded-vt-if-is-nonempty"
requirement = "functions.control"
candidate = "required"
description = "if treats whitespace produced by expansion as a nonempty condition."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b"

[expected]
exit_code = 0
stdout_hex = "3c7468656e3e0a"
stderr_hex = ""
