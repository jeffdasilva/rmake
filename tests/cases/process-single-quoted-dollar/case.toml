id = "process-single-quoted-dollar"
requirement = "process.invocation"
candidate = "required"
description = "Dollar bytes within single quotes remain literal after Make expansion"
provenance = "Original rmake fixture; authored from independent GNU Make 4.4.1 behavior probes, without copying upstream tests."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "literal$HOME\n"
stderr = ""
