id = "whitespace-all-c-whitespace-addprefix"
requirement = "functions.paths"
candidate = "required"
description = "addprefix applies the prefix to every C-whitespace-delimited word."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b \talpha\t\n\r\f\u000bbeta\u000b \talpha\f\r "
"P" = "a%\u000bb%"

[expected]
exit_code = 0
stdout_hex = "3c7072652d616c706861207072652d62657461207072652d616c7068613e0a"
stderr_hex = ""
