id = "command-replay-authored-override-reader-eval"
requirement = "variables.command-line-replay"
candidate = "required"
description = "A global reader eval defines the same authored public override reference."
provenance = "Original rmake fixture, independently qualified against pinned GNU Make."
args = ["-rRk", "--no-print-directory", "--jobs=1", "-e", "MARK=from-cli", "all"]
timeout_seconds = 5

[expected]
exit_code = 0
stderr = ""
stdout = '''
ENTRY|command line|from-cli|environment override|ekrR -j1 --no-print-directory -- $(MAKEOVERRIDES)
ALIAS|read|undefined
READ|override|from-public|override|undefined|override|recursive|--silent -- $(MAKEOVERRIDES)
ALIAS|run|override
RUN|override|from-public|override|undefined|override|--silent -- $(MAKEOVERRIDES)
ALIAS|run|override
ENV|--silent -- MARK=from-public SIDE=override
'''
