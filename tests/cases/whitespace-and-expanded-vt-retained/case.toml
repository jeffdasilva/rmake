id = "whitespace-and-expanded-vt-retained"
requirement = "functions.control"
candidate = "required"
description = "and retains vertical-tab whitespace produced by expansion of its selected final argument."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b"

[expected]
exit_code = 0
stdout_hex = "3c0b3e0a"
stderr_hex = ""
