id = "oneshell-first-ignore-applies-whole"
requirement = "recipes.oneshell"
candidate = "required"
description = "A first-line ignore modifier applies to the combined shell outcome."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "before\n"
stderr = "make: [Makefile:6: all] Error 6 (ignored)\n"
