id = "late-gpath-merged-source-pattern-control"
requirement = "scope.target-eager-latest-parent"
candidate = "required"
description = "Keep source pattern bindings out of the destination file table during a searched rename."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "parent", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "activate-source-pattern\nscope=[parent||input|input|7|override|destination|file||]\nenv=[.SHELLSTATUS|7 ANCHOR_3190|source]\n"
stderr = ""
