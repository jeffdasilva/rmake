id = "suffix-clear-readd"
requirement = "rules.suffix-metadata"
candidate = "required"
description = "An empty suffix declaration clears prior dependencies before later append."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5
[expected]
exit_code = 0
stdout = "<item.a.x>|<item>|<.>|<item>\n<other.x>|<>|<>|<>\n"
stderr = ""
