id = "scope-append-inherited"
requirement = "scope.target-specific"
candidate = "required"
description = "Appending on a prerequisite retains the inherited parent value and passes the combined value onward."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "leaf=parent child\nchild=parent child\nparent=parent\n"
stderr = ""
