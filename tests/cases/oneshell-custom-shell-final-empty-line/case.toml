id = "oneshell-custom-shell-final-empty-line"
requirement = "recipes.oneshell"
candidate = "required"
description = "A final empty stored recipe contributes a final newline to the custom shell script argument."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[expected]
exit_code = 0
stdout = "argc=2\narg=<-c>\narg=<first\n>\n"
stderr = ""
