id = "retained-predeclared-status-explicit-reexport"
requirement = "scope.secondary-retained"
candidate = "required"
description = "Change a predeclared unexport policy on the same slot after a shell completes."
provenance = "Original independently asserted GNU Make 4.4.1 fixture."
args = ["-rR", "--no-print-directory", "-j1", "parent", "after"]
timeout_seconds = 4

[expected]
exit_code = 0
stdout = "status=[parent|accepted|override|simple|accepted]\nenv=[.SHELLSTATUS|accepted ANCHOR_3190|before ANCHOR_4413|after]\n"
stderr = ""
