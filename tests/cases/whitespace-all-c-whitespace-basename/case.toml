id = "whitespace-all-c-whitespace-basename"
requirement = "functions.paths"
candidate = "required"
description = "basename splits every C-whitespace-delimited filename before removing suffixes."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000bdir/a.c\t\n\r\f\u000bplain.rs\u000blast.txt \u000b"

[expected]
exit_code = 0
stdout_hex = "3c6469722f6120706c61696e206c6173743e0a"
stderr_hex = ""
