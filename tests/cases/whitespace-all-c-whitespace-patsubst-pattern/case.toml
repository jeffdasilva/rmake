id = "whitespace-all-c-whitespace-patsubst-pattern"
requirement = "functions.text"
candidate = "required"
description = "Wildcard patsubst splits every C-locale ASCII whitespace byte and normalizes output separators."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

[environment]
"W" = "\u000b \talpha\t\n\r\f\u000bbeta\u000b \talpha\f\r "
"P" = "a%\u000bb%"

[expected]
exit_code = 0
stdout_hex = "3c616c706858206265745820616c7068583e0a"
stderr_hex = ""
