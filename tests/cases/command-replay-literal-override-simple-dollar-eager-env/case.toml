id = "command-replay-literal-override-simple-dollar-eager-env"
requirement = "variables.command-line-replay"
candidate = "required"
description = "A winning simple override under -e evaluates its immediate RHS once and replays the resulting literal flags."
provenance = "Original rmake fixture, independently qualified against pinned GNU Make."
args = ["--no-builtin-rules", "--no-builtin-variables", "--keep-going", "--no-print-directory", "--jobs=1", "--environment-overrides", "MARK=from-cli", "all"]
timeout_seconds = 5

[expected]
exit_code = 0
stderr = ""
stdout = '''
ENTRY|command line|from-cli|ekrR -j1 --no-print-directory -- $(MAKEOVERRIDES)
RHS|read
READ|override|price$tag|override|published|simple|--silent -- MARK=price$tag SIDE=published
RUN|override|price$tag|priceag|override|published|simple|--silent -- MARK=price$tag SIDE=published
ENV|--silent -- MARK=price$tag SIDE=published
'''
