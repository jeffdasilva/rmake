id = "command-replay-simple-reference-data-dynamic-recursive-control"
requirement = "variables.command-line-replay"
candidate = "required"
description = "A recursive override with a dynamic prefix keeps the separate reader, replay, and export expansions."
provenance = "Original rmake fixture, independently qualified against pinned GNU Make."
args = ["--no-builtin-rules", "--no-builtin-variables", "--keep-going", "--no-print-directory", "--jobs=1", "MARK=from-cli", "all"]
timeout_seconds = 5

[expected]
exit_code = 0
stderr = ""
stdout = '''
ENTRY|command line|from-cli|krR -j1 --no-print-directory -- $(MAKEOVERRIDES)
PREFIX|read
READ|undefined||undefined||recursive|$(SWITCH) -- $(MAKEOVERRIDES)
PREFIX|run
RUN|undefined||undefined||recursive|$(SWITCH) -- $(MAKEOVERRIDES)
CONSUME-BEGIN
CONSUME|
PREFIX|run
ENV|--silent -- |
'''
