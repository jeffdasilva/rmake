id = "span-patsubst-literal-escaped-percent-control-bytes"
requirement = "functions.text"
candidate = "required"
description = "An escaped percent makes patsubst a literal whole-word match while raw control bytes remain within words."
provenance = "Independently authored from documented behavior and black-box GNU Make 4.4.1 observations; no upstream test code."
args = ["-rR", "--no-print-directory"]
timeout_seconds = 5

