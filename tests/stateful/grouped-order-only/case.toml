id = "grouped-order-only"
description = "Original grouped-output incremental and timestamp boundary probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "a", "content" = "old\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "b", "content" = "old\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "extra", "content" = "old\n", "mtime_ns" = 1600000000000000002 }]

[[steps]]
name = "newer-order-only"
actions = []
args = ["-rR", "--no-print-directory"]
unchanged = ["a", "b", "extra"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "make: Nothing to be done for 'all'.\n", "stderr" = "" }

[[steps]]
name = "recreate-order-only"
actions = [{ "op" = "remove", "path" = "extra" }]
args = ["-rR", "--no-print-directory"]
unchanged = ["a", "b"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "extra\n", "stderr" = "" }
