id = "symlink-dangling-transitions"
description = "Dangling and restored chains across flag changes, deletion, rebuild and exact output verification"
provenance = "Original fixed bytes, symlink timestamps and independently authored expectations; no upstream tests or implementation copied."
initial = [{"op" = "write", "path" = "phase", "content" = "4\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "out", "content" = "phase=3\n", "mtime_ns" = 1600000060000000000}]

[[steps]]
name = "dangling-chain-outdated"
actions = [{"op" = "write", "path" = "phase", "content" = "4\n", "mtime_ns" = 1600000000000000000}]
args = ["-rR", "--no-print-directory", "-L", "-q"]
unchanged = ["out"]
exact_mtime = {"link" = 1600000065000000000, "hop" = 1600000070000000000, "input" = 1600000000000000000, "out" = 1600000060000000000}
expected = {"exit_code" = 1, "stdout" = "", "stderr" = ""}

