id = "chain-missing-old"
description = "Intermediate chain update and retention across repeated builds: missing-old."
provenance = "Original rmake fixture; independently authored and observed against pinned GNU Make 4.4.1."
initial = [{"op" = "write", "path" = "x.src", "content" = "data\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "x.out", "content" = "data\n", "mtime_ns" = 1600000000000000020}]

[[steps]]
name = "first"
expected = {"exit_code" = 0, "stdout" = "make: 'x.out' is up to date.\n", "stderr" = ""}
unchanged = ["x.out", "x.src"]
exact_mtime = {"x.out" = 1600000000000000020, "x.src" = 1600000000000000000}
mtime_order = [["x.out", ">", "x.src"]]

[[steps]]
name = "repeat"
expected = {"exit_code" = 0, "stdout" = "make: 'x.out' is up to date.\n", "stderr" = ""}
unchanged = ["x.out", "x.src"]
exact_mtime = {"x.out" = 1600000000000000020, "x.src" = 1600000000000000000}
mtime_order = [["x.out", ">", "x.src"]]
