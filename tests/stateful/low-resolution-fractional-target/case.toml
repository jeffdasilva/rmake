id = "low-resolution-fractional-target"
description = "Original low-resolution timestamp comparison and cleanup probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "out", "content" = "old\n", "mtime_ns" = 1600000000100000000 }, { "op" = "write", "path" = "input", "content" = "old\n", "mtime_ns" = 1600000000200000000 }]

[[steps]]
name = "fractional-noop"
actions = []
args = ["-rR", "--no-print-directory"]
unchanged = ["out", "input"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "make: *** Warning: .LOW_RESOLUTION_TIME file 'out' has a high resolution time stamp\n" }

[[steps]]
name = "next-second"
actions = [{ "op" = "utime", "path" = "input", "mtime_ns" = 1600000001000000000 }]
args = ["-rR", "--no-print-directory"]
unchanged = []
mtime_order = []
exact_mtime = { "out" = 1600000002000000000 }
expected = { "exit_code" = 0, "stdout" = "build:input\n", "stderr" = "make: *** Warning: .LOW_RESOLUTION_TIME file 'out' has a high resolution time stamp\n" }

[[steps]]
name = "new-whole-second-noop"
actions = []
args = ["-rR", "--no-print-directory"]
unchanged = ["out", "input"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
