id = "grouped-error-preserves-old-time"
description = "Original grouped-output incremental and timestamp boundary probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "a", "content" = "old\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "b", "content" = "old\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "source", "content" = "old\n", "mtime_ns" = 1600000000000000002 }]

[[steps]]
name = "failure"
actions = []
args = ["-rR", "--no-print-directory", "-k"]
unchanged = ["a", "source"]
mtime_order = []
exact_mtime = { "a" = 1600000000000000000 }
expected = { "exit_code" = 2, "stdout" = "", "stderr" = "make: *** [Makefile:3: a] Error 7\nmake: *** [a] Deleting file 'b'\nmake: Target 'all' not remade because of errors.\n" }

[[steps]]
name = "query-missing"
actions = []
args = ["-rR", "--no-print-directory", "-q"]
unchanged = ["a", "source"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 1, "stdout" = "", "stderr" = "" }
