id = "remake-live-flags-required"
description = "Live MAKEFLAGS changes use the current remake mode, keep explicit changes effective, and publish phase flags for required sources."
provenance = "Original rmake inputs and exact expectations independently checked with repeated GNU Make 4.4.1 runs. No upstream source or tests were consulted for these cases."
initial = []

[[steps]]
name = "query-unchanged"
args = ["-rR", "-q"]
actions = [
  {"op" = "write", "path" = "Makefile", "content" = "include opts.mk\nall: out\n\t@printf \"parent\\n\"\nout: seed\n\tcp seed out\nopts.mk: seed\n\t$(info BEFORE=[$(MAKEFLAGS)])$(info AFTER=[$(MAKEFLAGS)])@printf \"GEN=yes\\n\" >opts.mk\n", "mtime_ns" = 1600000000000000000},
  {"op" = "write", "path" = "opts.mk", "content" = "# stale\n", "mtime_ns" = 1600000000000000000},
  {"op" = "write", "path" = "seed", "content" = "seed\n", "mtime_ns" = 1600000001000000000},
]
expected = {"exit_code" = 1, "stdout" = "BEFORE=[rR]\nAFTER=[rR]\n", "stderr" = ""}
unchanged = ["Makefile", "seed"]
mtime_order = [["opts.mk", ">", "seed"]]

