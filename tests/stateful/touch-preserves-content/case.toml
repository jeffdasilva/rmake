id = "touch-preserves-content"
description = "Touch mode advances an existing target timestamp without running its content-changing recipe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "new\n", "mtime_ns" = 1600000000000000001 }, { "op" = "write", "path" = "out", "content" = "old\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "touch"
args = ["-rR", "--no-print-directory", "-t"]
actions = []
expected = { "exit_code" = 0, "stdout" = "touch out\n", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = [["out", ">", "source"]]

[[steps]]
name = "touched-noop"
args = ["-rR", "--no-print-directory"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000002 }]
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "question-clean"
args = ["-rR", "--no-print-directory", "-q"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000002 }]
expected = { "exit_code" = 0, "stdout" = "", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []
