id = "low-resolution-error-preserves-actual"
description = "Original low-resolution timestamp comparison and cleanup probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "out", "content" = "old\n", "mtime_ns" = 1600000000123000000 }, { "op" = "write", "path" = "input", "content" = "old\n", "mtime_ns" = 1600000001000000000 }]

[[steps]]
name = "restore-before-error"
actions = []
args = ["-rR", "--no-print-directory"]
unchanged = ["out", "input"]
mtime_order = []
exact_mtime = { "out" = 1600000000123000000 }
expected = { "exit_code" = 2, "stdout" = "", "stderr" = "make: *** Warning: .LOW_RESOLUTION_TIME file 'out' has a high resolution time stamp\nmake: *** [Makefile:3: out] Error 7\n" }

[[steps]]
name = "question"
actions = []
args = ["-rR", "--no-print-directory", "-q"]
unchanged = ["out", "input"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 1, "stdout" = "", "stderr" = "make: *** Warning: .LOW_RESOLUTION_TIME file 'out' has a high resolution time stamp\n" }
