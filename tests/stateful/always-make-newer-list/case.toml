id = "always-make-newer-list"
description = "Always-make includes older normal prerequisites in the deduplicated automatic newer list."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "source\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "out", "content" = "out\n", "mtime_ns" = 1600000000000000001 }]

[[steps]]
name = "initial-noop"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "forced"
args = ["-rR", "--no-print-directory", "-B"]
actions = []
expected = { "exit_code" = 0, "stdout" = "<source>\n", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "forced-again"
args = ["-rR", "--no-print-directory", "-B"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000001 }]
expected = { "exit_code" = 0, "stdout" = "<source>\n", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = []
