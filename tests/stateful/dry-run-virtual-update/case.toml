id = "dry-run-virtual-update"
description = "Dry-run treats a rebuilt child as updated when deciding whether to print its parent recipe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "trigger", "content" = "trigger\n", "mtime_ns" = 1600000000000000010 }, { "op" = "write", "path" = "child", "content" = "child\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "out", "content" = "out\n", "mtime_ns" = 1600000000000000020 }]

[[steps]]
name = "dry-run"
args = ["-rR", "--no-print-directory", "-n"]
actions = []
expected = { "exit_code" = 0, "stdout" = "touch child\ntouch out\n", "stderr" = "" }
unchanged = ["out", "child", "trigger", "Makefile"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "real-build"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = [["out", ">=", "child"], ["child", ">", "trigger"]]

[[steps]]
name = "built-noop"
args = ["-rR", "--no-print-directory"]
actions = [{ "op" = "utime", "path" = "child", "mtime_ns" = 1600000000000000011 }, { "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000012 }]
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "child", "trigger"]
exact_mtime = {  }
mtime_order = []
