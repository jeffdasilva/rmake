id = "low-resolution-prerequisite-actual"
description = "Original low-resolution timestamp comparison and cleanup probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "input", "content" = "old\n", "mtime_ns" = 1600000000900000000 }, { "op" = "write", "path" = "out", "content" = "old\n", "mtime_ns" = 1600000000100000000 }]

[[steps]]
name = "actual-prerequisite-newer"
actions = []
args = ["-rR", "--no-print-directory"]
unchanged = []
mtime_order = []
exact_mtime = { "out" = 1600000002000000000 }
expected = { "exit_code" = 0, "stdout" = "build\n", "stderr" = "make: *** Warning: .LOW_RESOLUTION_TIME file 'input' has a high resolution time stamp\n" }

[[steps]]
name = "actual-prerequisite-older"
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000950000000 }]
args = ["-rR", "--no-print-directory"]
unchanged = ["out", "input"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "make: *** Warning: .LOW_RESOLUTION_TIME file 'input' has a high resolution time stamp\n" }
