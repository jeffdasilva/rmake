id = "archive-observation-transitions"
description = "Archive member/container replacement, standalone timestamps, GPATH and hidden secondary edges"
provenance = "Original scripts, archive bytes, fixed timestamp transitions and independent status/stream anchors; no upstream tests copied."
initial = [{"op" = "write", "path" = "config.mk", "content" = "VPATH=store\nDEPS=archive.a(member)\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "store/archive.a", "content" = "!<arch>\nmember/         1600000020  0     0     100644  8         `\npayload\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "member", "content" = "standalone\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "out", "content" = "original output\n", "mtime_ns" = 1600000040000000000}, {"op" = "write", "path" = "next-time", "content" = "1600000060000000000", "mtime_ns" = 1600000000000000000}]

[[steps]]
name = "remote-old-query"
args = ["-rR", "--no-print-directory", "-q"]
actions = []
unchanged = ["out"]
expected = {"exit_code" = 0, "stdout" = "", "stderr" = ""}

