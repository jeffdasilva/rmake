id = "double-grouped-deleted-peer"
description = "Original grouped-output incremental and timestamp boundary probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "a", "content" = "old\n", "mtime_ns" = 1600000000000000002 }, { "op" = "write", "path" = "b", "content" = "old\n", "mtime_ns" = 1600000000000000002 }, { "op" = "write", "path" = "source", "content" = "old\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "missing-c"
actions = []
args = ["-rR", "--no-print-directory"]
unchanged = ["a", "source"]
mtime_order = []
exact_mtime = { "b" = 1600000000000000004, "c" = 1600000000000000004 }
expected = { "exit_code" = 0, "stdout" = "second b\n", "stderr" = "" }

[[steps]]
name = "missing-b"
actions = [{ "op" = "remove", "path" = "b" }]
args = ["-rR", "--no-print-directory"]
unchanged = ["c", "source"]
mtime_order = []
exact_mtime = { "a" = 1600000000000000004, "b" = 1600000000000000004, "c" = 1600000000000000004 }
expected = { "exit_code" = 0, "stdout" = "first a\nsecond b\n", "stderr" = "" }
