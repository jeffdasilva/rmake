id = "question-has-no-effects"
description = "Question mode reports work without writing outputs and becomes clean after an actual build."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "new\n", "mtime_ns" = 1600000000000000001 }, { "op" = "write", "path" = "out", "content" = "old\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "question-dirty"
args = ["-rR", "--no-print-directory", "-q"]
actions = []
expected = { "exit_code" = 1, "stdout" = "", "stderr" = "" }
unchanged = ["out", "source", "Makefile"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "build"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "build\n", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "question-clean"
args = ["-rR", "--no-print-directory", "-q"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000002 }]
expected = { "exit_code" = 0, "stdout" = "", "stderr" = "" }
unchanged = ["out", "source", "Makefile"]
exact_mtime = {  }
mtime_order = []
