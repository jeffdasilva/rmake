id = "equal-nanoseconds"
description = "Equal prerequisite and target timestamps do not force a rebuild."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "source\n", "mtime_ns" = 1600000000123456789 }, { "op" = "write", "path" = "out", "content" = "out\n", "mtime_ns" = 1600000000123456789 }]

[[steps]]
name = "equal"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = { "out" = 1600000000123456789, "source" = 1600000000123456789 }
mtime_order = [["out", "=", "source"]]

[[steps]]
name = "equal-again"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []
