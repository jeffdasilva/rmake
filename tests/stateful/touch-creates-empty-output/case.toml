id = "touch-creates-empty-output"
description = "Touch mode creates an absent output as an empty file, then leaves it current."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "source\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "touch-absent"
args = ["-rR", "--no-print-directory", "-t"]
actions = []
expected = { "exit_code" = 0, "stdout" = "touch out\n", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = [["out", ">", "source"]]

[[steps]]
name = "touch-existing-noop"
args = ["-rR", "--no-print-directory", "-t"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000001 }]
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []
