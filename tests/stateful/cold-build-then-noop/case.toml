id = "cold-build-then-noop"
description = "Build an absent output, then preserve bytes and nanoseconds on a second invocation."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "one\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "build"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "build\n", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = [["out", ">", "source"]]

[[steps]]
name = "noop"
args = ["-rR", "--no-print-directory"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000001 }]
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source", "Makefile"]
exact_mtime = {  }
mtime_order = []
