initial = [{ "op" = "write", "path" = "a", "content" = "old\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "b", "content" = "old\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "c", "content" = "old\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "touch"
actions = []
args = ["-rR", "--no-print-directory", "-t"]
unchanged = []
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "touch a\ntouch b\ntouch b\ntouch c\n", "stderr" = "" }

[[steps]]
