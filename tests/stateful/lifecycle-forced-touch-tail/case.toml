id = "lifecycle-forced-touch-tail"
description = "A real child followed by a skipped line touches twice; dry-run preserves mtime and query continuation deletes the target."
provenance = "Original rmake scenario and expectations; authored after source-informed behavior notes, without copying upstream tests or implementation text."
initial = [{ "op" = "write", "path" = "source", "content" = "source\n", "mtime_ns" = 1600000000000000010 }, { "op" = "write", "path" = "out", "content" = "payload\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "touch"
args = ["-rR", "--no-print-directory", "-t", "out"]
actions = []
expected = { "exit_code" = 0, "stdout" = "touch out\ntouch out\n", "stderr" = "" }
unchanged = ["source"]
exact_mtime = {  }
mtime_order = [["out", ">", "source"]]

[[steps]]
name = "query-clean"
args = ["-rR", "--no-print-directory", "-q", "out"]
actions = []
expected = { "exit_code" = 0, "stdout" = "", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "dry-forced"
args = ["-rR", "--no-print-directory", "-nt", "out"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000000 }]
expected = { "exit_code" = 0, "stdout" = "true\ntouch out\ntouch out\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = { "out" = 1600000000000000000 }
mtime_order = []

[[steps]]
name = "query-continuation"
args = ["-rR", "--no-print-directory", "-q", "out"]
actions = []
expected = { "exit_code" = 1, "stdout" = "", "stderr" = "make: *** Deleting file 'out'\n" }
unchanged = ["source"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "verify-deletion"
args = ["-rR", "--no-print-directory", "verify"]
actions = []
expected = { "exit_code" = 0, "stdout" = "verified\n", "stderr" = "" }
unchanged = ["source"]
exact_mtime = {  }
mtime_order = []
