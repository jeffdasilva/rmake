id = "changed-prerequisite"
description = "A controlled prerequisite change triggers rebuild followed by a stable no-op."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "one\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "out", "content" = "one\n", "mtime_ns" = 1600000000000000002 }]

[[steps]]
name = "initial-noop"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "source-change"
args = ["-rR", "--no-print-directory"]
actions = [{ "op" = "write", "path" = "source", "content" = "two\n", "mtime_ns" = 1600000000000000003 }]
expected = { "exit_code" = 0, "stdout" = "build\n", "stderr" = "" }
unchanged = []
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "after-rebuild-noop"
args = ["-rR", "--no-print-directory"]
actions = [{ "op" = "utime", "path" = "out", "mtime_ns" = 1600000000000000004 }]
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []
