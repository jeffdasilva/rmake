id = "missing-order-only"
description = "Build a missing order-only prerequisite while preserving an existing newer target."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "source", "content" = "source\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "out", "content" = "out\n", "mtime_ns" = 1600000000000000001 }]

[[steps]]
name = "create-order-only"
args = ["-rR", "--no-print-directory"]
actions = []
expected = { "exit_code" = 0, "stdout" = "stamp\n", "stderr" = "" }
unchanged = ["out", "source"]
exact_mtime = {  }
mtime_order = []

[[steps]]
name = "order-only-exists"
args = ["-rR", "--no-print-directory"]
actions = [{ "op" = "utime", "path" = "stamp", "mtime_ns" = 1600000000000000002 }]
expected = { "exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = "" }
unchanged = ["out", "source", "stamp"]
exact_mtime = {  }
mtime_order = []
