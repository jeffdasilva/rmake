id = "intermediate-policy-transitions"
description = "Lazy intermediate chains across missing leaves, query, forced rebuilds, removal and policy changes"
provenance = "Original rmake twelve-step fixed-time scenario; no upstream tests copied."
initial = [{"op" = "write", "path" = "out", "content" = "output\n", "mtime_ns" = 1600000002000000000}, {"op" = "write", "path" = "input", "content" = "old\n", "mtime_ns" = 1600000000000000000}]

[[steps]]
name = "skip-missing-middle"
actions = []
args = ["-rR", "--no-print-directory", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000002000000000}
expected = {"exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = ""}

[[steps]]
name = "query-unchanged"
actions = []
args = ["-rR", "--no-print-directory", "-q", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000002000000000}
expected = {"exit_code" = 0, "stdout" = "", "stderr" = ""}

[[steps]]
name = "remove-leaf-query"
actions = [{"op" = "remove", "path" = "input"}]
args = ["-rR", "--no-print-directory", "-q", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000002000000000}
expected = {"exit_code" = 0, "stdout" = "", "stderr" = ""}

[[steps]]
name = "missing-leaf-still-current"
actions = []
args = ["-rR", "--no-print-directory", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000002000000000}
expected = {"exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = ""}

[[steps]]
name = "always-requires-missing-leaf"
actions = []
args = ["-rR", "--no-print-directory", "-B", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000002000000000}
expected = {"exit_code" = 2, "stdout" = "", "stderr" = "make: *** No rule to make target 'input', needed by 'mid'.  Stop.\n"}

[[steps]]
name = "new-input-query"
actions = [{"op" = "write", "path" = "input", "content" = "new\n", "mtime_ns" = 1600000004000000000}]
args = ["-rR", "--no-print-directory", "-q", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000002000000000}
expected = {"exit_code" = 1, "stdout" = "", "stderr" = ""}

[[steps]]
name = "materialize-newer-chain"
actions = []
args = ["-rR", "--no-print-directory", "out"]
unchanged = []
exact_mtime = {"out" = 1600000004000000000, "mid" = 1600000004000000000}
expected = {"exit_code" = 0, "stdout" = "mid=mid\nout=out\n", "stderr" = ""}

[[steps]]
name = "remove-middle-again"
actions = [{"op" = "remove", "path" = "mid"}]
args = ["-rR", "--no-print-directory", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000004000000000}
expected = {"exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = ""}

[[steps]]
name = "newer-input-builds-middle"
actions = [{"op" = "write", "path" = "input", "content" = "newer\n", "mtime_ns" = 1600000006000000000}]
args = ["-rR", "--no-print-directory", "out"]
unchanged = []
exact_mtime = {"out" = 1600000006000000000, "mid" = 1600000006000000000}
expected = {"exit_code" = 0, "stdout" = "mid=mid\nout=out\n", "stderr" = ""}

[[steps]]
name = "named-exclusion-materializes"
actions = [{"op" = "write", "path" = "Makefile", "content" = ".SECONDARY:\n.NOTINTERMEDIATE: mid\nall: out\nout: mid\n\t@echo out=$@; cp -p $< $@\nmid: input\n\t@echo mid=$@; cp -p $< $@\n", "mtime_ns" = 1600000000000000000}, {"op" = "remove", "path" = "mid"}]
args = ["-rR", "--no-print-directory", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000006000000000, "mid" = 1600000006000000000}
expected = {"exit_code" = 0, "stdout" = "mid=mid\n", "stderr" = ""}

[[steps]]
name = "global-not-explicit-intermediate"
actions = [{"op" = "write", "path" = "Makefile", "content" = ".NOTINTERMEDIATE:\n.INTERMEDIATE: mid\nall: out\nout: mid\n\t@echo out=$@; cp -p $< $@\nmid: input\n\t@echo mid=$@; cp -p $< $@\n", "mtime_ns" = 1600000000000000000}, {"op" = "remove", "path" = "mid"}]
args = ["-rR", "--no-print-directory", "out"]
unchanged = ["out"]
exact_mtime = {"out" = 1600000006000000000}
expected = {"exit_code" = 0, "stdout" = "make: 'out' is up to date.\n", "stderr" = ""}

[[steps]]
name = "global-not-retains-created-middle"
actions = [{"op" = "write", "path" = "input", "content" = "last\n", "mtime_ns" = 1600000008000000000}]
args = ["-rR", "--no-print-directory", "out"]
unchanged = []
exact_mtime = {"out" = 1600000008000000000, "mid" = 1600000008000000000}
expected = {"exit_code" = 0, "stdout" = "mid=mid\nout=out\n", "stderr" = ""}
