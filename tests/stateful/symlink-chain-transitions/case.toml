id = "symlink-chain-transitions"
description = "Link/hop/referent time changes, dangling and restored chains, query and rebuild"
provenance = "Original fixed bytes, symlink timestamps and independently authored expectations; no upstream tests or implementation copied."
initial = [{"op" = "write", "path" = "phase", "content" = "0\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "out", "content" = "old\n", "mtime_ns" = 1600000010000000000}]

[[steps]]
name = "old-links-current"
actions = []
args = ["-rR", "--no-print-directory", "-L", "-q"]
unchanged = ["out"]
exact_mtime = {"link" = 1600000005000000000, "hop" = 1600000003000000000, "input" = 1600000000000000000, "out" = 1600000010000000000}
expected = {"exit_code" = 0, "stdout" = "", "stderr" = ""}

