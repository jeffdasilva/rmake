id = "grouped-missing-peer"
description = "Original grouped-output incremental and timestamp boundary probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "a", "content" = "old\n", "mtime_ns" = 1600000000000000002 }, { "op" = "write", "path" = "b", "content" = "old\n", "mtime_ns" = 1600000000000000002 }, { "op" = "write", "path" = "source", "content" = "old\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "noop"
actions = []
args = ["-rR", "--no-print-directory"]
unchanged = ["a", "b", "source"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "make: Nothing to be done for 'all'.\n", "stderr" = "" }

[[steps]]
name = "remove-peer"
actions = [{ "op" = "remove", "path" = "b" }]
args = ["-rR", "--no-print-directory"]
unchanged = []
mtime_order = [["a", ">", "source"], ["b", ">", "source"]]
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "build a:source\n", "stderr" = "" }

[[steps]]
name = "new-noop"
actions = [{ "op" = "utime", "path" = "a", "mtime_ns" = 1600000000000000004 }, { "op" = "utime", "path" = "b", "mtime_ns" = 1600000000000000004 }]
args = ["-rR", "--no-print-directory"]
unchanged = ["a", "b", "source"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "make: Nothing to be done for 'all'.\n", "stderr" = "" }
