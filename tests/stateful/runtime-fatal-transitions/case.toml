id = "runtime-fatal-transitions"
description = "Post-child fatal configuration, recovery, modes and protected output transitions"
provenance = "Original helper, fixed input timestamps, exact stream/status anchors and relational touch checks; no upstream tests copied."
initial = [{"op" = "write", "path" = "config.mk", "content" = "FAIL=\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "next-time", "content" = "1600000002000000000", "mtime_ns" = 1600000000000000000}]

[[steps]]
name = "healthy-serial"
args = ["-rR", "--no-print-directory", "--jobserver-style=pipe"]
actions = []
expected = {"exit_code" = 0, "stdout" = "completed\n", "stderr" = ""}
unchanged = []
exact_mtime = {"target" = 1600000002000000000}
mtime_order = []

[[steps]]
name = "fatal-parallel"
args = ["-rR", "--no-print-directory", "--jobserver-style=pipe", "-j2"]
actions = [{"op" = "write", "path" = "config.mk", "content" = "FAIL=1\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "next-time", "content" = "1600000003000000000", "mtime_ns" = 1600000000000000000}, {"op" = "remove", "path" = "trigger"}]
expected = {"exit_code" = 2, "stdout" = "", "stderr" = "Makefile:7: *** stopped.  Stop.\nmake: *** Waiting for unfinished jobs....\nmake: *** wait: No child processes.  Stop.\n"}
unchanged = []
exact_mtime = {"target" = 1600000003000000000}
mtime_order = []

