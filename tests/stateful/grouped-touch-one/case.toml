id = "grouped-touch-one"
description = "Original grouped-output incremental and timestamp boundary probe."
provenance = "Original rmake fixture; behavior independently checked against GNU Make 4.4.1."
initial = [{ "op" = "write", "path" = "a", "content" = "old\n", "mtime_ns" = 1600000000000000000 }, { "op" = "write", "path" = "b", "content" = "old\n", "mtime_ns" = 1600000000000000000 }]

[[steps]]
name = "touch-owner"
actions = []
args = ["-rR", "--no-print-directory", "-t", "-B", "a"]
unchanged = ["b"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "touch a\n", "stderr" = "" }

[[steps]]
name = "touch-peer"
actions = []
args = ["-rR", "--no-print-directory", "-t", "-B", "b"]
unchanged = ["a"]
mtime_order = []
exact_mtime = {  }
expected = { "exit_code" = 0, "stdout" = "touch b\n", "stderr" = "" }
