id = "chain-explicit-intermediate"
description = "Intermediate chain update and retention across repeated builds: explicit-intermediate."
provenance = "Original rmake fixture; independently authored and observed against pinned GNU Make 4.4.1."
initial = [{"op" = "write", "path" = "x.src", "content" = "data\n", "mtime_ns" = 1600000000000000010}, {"op" = "write", "path" = "x.mid", "content" = "data\n", "mtime_ns" = 1600000000000000000}, {"op" = "write", "path" = "x.out", "content" = "data\n", "mtime_ns" = 1600000000000000020}]

[[steps]]
name = "first"
expected = {"exit_code" = 0, "stdout" = "explicit\nfinal\n", "stderr" = ""}
unchanged = ["x.src"]
exact_mtime = {"x.src" = 1600000000000000010}
mtime_order = [["x.out", ">", "x.src"]]

[[steps]]
name = "repeat"
expected = {"exit_code" = 0, "stdout" = "make: 'x.out' is up to date.\n", "stderr" = ""}
unchanged = ["x.out", "x.src", "x.mid"]
exact_mtime = {"x.src" = 1600000000000000010}
mtime_order = [["x.out", ">", "x.src"]]
