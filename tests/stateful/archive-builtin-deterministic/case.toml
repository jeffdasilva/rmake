[[steps]]
name = "first-build"
actions = []
args = ["--no-print-directory"]
unchanged = []
mtime_order = []
exact_mtime = {}
expected = {"exit_code" = 0, "stdout" = "ar rcD lib.a one.o\n", "stderr" = ""}

