name: Native x86-64 musl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-musl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-musl:
    name: Native x86-64 dynamic musl smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          mkdir -p artifacts/native-musl
          python3 tools/rust.py bootstrap 2>&1 | tee artifacts/native-musl/rust-bootstrap.log
      - name: Check the dynamic musl profile
        run: |
          python3 tools/musl_smoke.py --report artifacts/native-musl/profile.json \
            --xxhash-report artifacts/native-musl/xxhash.json \
            --lua-report artifacts/native-musl/lua.json 2>&1 \
            | tee artifacts/native-musl/smoke.log
      - name: Retain the profile and observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-musl-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/native-musl/
          if-no-files-found: ignore
          retention-days: 14
