name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: compatibility-${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: [development, optimized]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned toolchain and reference
        run: make bootstrap
      - name: Run development gates
        if: matrix.gate == 'development'
        run: make ci
      - name: Run optimized M4 and M5 regression gates
        if: matrix.gate == 'optimized'
        run: make test-m5-release
      - name: Retain conformance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.gate }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: compatibility
    needs: validation
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every compatibility gate
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
