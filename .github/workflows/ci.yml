name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: compatibility-${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: development
            timeout: 150
          - gate: optimized
            timeout: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned toolchain and reference
        run: make bootstrap
      - name: Run development gates
        if: matrix.gate == 'development'
        run: make ci test-resource-nproc test-resource-nproc-selfhost
      - name: Run optimized M4 and M5 regression gates
        if: matrix.gate == 'optimized'
        run: make test-m5-release test-resource-nproc-release
      - name: Retain conformance reports
        if: always()
        # Report storage is independent of the test result.
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.gate }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/
            .tools/locale-data/profile.json
            .tools/locale-data/provenance/*
          if-no-files-found: ignore
          retention-days: 14

  guile-components:
    name: guile-component-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tools, separate enabled reference and component architecture
        run: make test-guile-components
      - name: Retain Guile profile provenance
        if: always()
        # Report storage is independent of the test result.
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guile-component-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .tools/guile/profile.json
            .tools/guile/reference-profile.json
            .tools/guile/references/*.json
            .tools/guile/references/*-build.log
            .tools/guile/provenance/signature-status.txt
            .tools/guile/provenance/*.package
          if-no-files-found: ignore
          retention-days: 14

  guile-frontend:
    name: guile-enabled-application
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare default and enabled application builds
        run: make test-guile-frontend
      - name: Retain application and SDK qualification
        if: always()
        # Report storage is independent of the test result.
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guile-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/guile-frontend/run-*/*.json
            .tools/guile/profile.json
            .tools/guile/reference-profile.json
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: compatibility
    needs: [validation, guile-components, guile-frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every compatibility gate
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          GUILE_COMPONENT_RESULT: ${{ needs['guile-components'].result }}
          GUILE_FRONTEND_RESULT: ${{ needs['guile-frontend'].result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$GUILE_COMPONENT_RESULT" = success
          test "$GUILE_FRONTEND_RESULT" = success
