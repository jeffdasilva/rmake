name: Native AArch64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-aarch64:
    name: Native AArch64 glibc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap and build
        run: |
          test "$(uname -m)" = aarch64
          make bootstrap-rust
          make bootstrap-oracle build release
      - name: Check host metadata
        env:
          PYTHONPATH: tools
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import oracle

          profile = oracle.verify()
          expected = profile["observed"]["variables"]["MAKE_HOST"]
          assert expected == "aarch64-unknown-linux-gnu", expected
          for kind in ("debug", "release"):
              candidate = (Path("target") / kind / "rmake").resolve()
              observed = oracle.probe_variables(candidate)["MAKE_HOST"]
              assert observed == expected, (kind, observed, expected)
          PY
      - name: Check subprocesses, restarts, and jobservers
        run: >-
          make --keep-going test-process-restarts test-restart-pipe test-jobserver
          test-native-spawn-stdio test-native-spawn-stdio-release
          test-native-restart-stdio test-native-restart-stdio-release
      - name: Check developer flows
        run: |
          make test-developer-flows
          python3 tools/developer_flows.py --candidate target/release/rmake \
            --report artifacts/developer-flows/optimized.json
      - name: Check evaluation stack switching
        run: |
          python3 tools/rust.py cargo test --locked -p rmake-linux --lib \
            evaluation::tests:: -- --test-threads=1
          python3 tools/rust.py cargo test --locked --release -p rmake-linux --lib \
            evaluation::tests:: -- --test-threads=1
      - name: Check deep live evaluation
        run: |
          for kind in debug release; do
            python3 tools/conformance.py --candidate "target/$kind/rmake" \
              --case live-eval-129-pure-none \
              --case live-eval-512-effects-target \
              --case live-eval-512-cycle-none \
              --repeat 2 --artifacts "artifacts/evaluation-aarch64/$kind"
          done
      - name: Check optimized file and archive ownership
        shell: bash
        timeout-minutes: 3
        run: |
          mkdir -p artifacts/file-owner-aarch64
          python3 tools/conformance.py --candidate target/release/rmake \
            --case gpath-late-merge-ordinary-goal-status \
            --case late-gpath-double-disjoint-imported-bindings \
            --case tentative-archive-missing-explicit-member \
            --case tentative-archive-retained-missing-member \
            --case tentative-archive-retained-gpath-control \
            --repeat 2 --artifacts artifacts/file-owner-aarch64 2>&1 \
            | tee artifacts/file-owner-aarch64/optimized.log
      - name: Check C, C.UTF-8 and French locale behavior
        timeout-minutes: 3
        run: |
          set -- --case all-c-one-flags --case all-utf8-one-flags --case recursive-all-utf8-one-read
          python3 tools/locale_profiles.py "$@" --report artifacts/locales/aarch64-gnu2.json
          python3 tools/locale_profiles.py "$@" --candidate target/release/rmake \
            --report artifacts/locales/aarch64-optimized.json
          set -- --case nls-debug-option-startup-c --case nls-debug-option-startup-fr \
            --case nls-startup-chdir-missing-c --case nls-startup-chdir-missing-fr \
            --case nls-startup-chdir-notdir-fr --case nls-startup-chdir-raw-fr
          python3 tools/nls_diagnostics.py "$@" \
            --locale-root .tools/locale-data-arm64 --report artifacts/locales/aarch64-fr-gnu2.json
          python3 tools/nls_diagnostics.py "$@" --candidate target/release/rmake \
            --locale-root .tools/locale-data-arm64 --report artifacts/locales/aarch64-fr-optimized.json
      - name: Check localized startup usage
        timeout-minutes: 3
        run: |
          for kind in debug release; do
            python3 tools/startup_usage.py --candidate "target/$kind/rmake" \
              --locale-root .tools/locale-data-arm64 \
              --report "artifacts/locales/aarch64-startup-usage-$kind.json"
            python3 tools/getopt_locale.py --candidate "target/$kind/rmake" \
              --locale-root .tools/locale-data-arm64 \
              --report "artifacts/locales/aarch64-getopt-$kind.json"
          done
      - name: Check localized build diagnostics
        timeout-minutes: 3
        run: |
          set -- \
            --case nls-stat-repair-loop-c \
            --case nls-stat-repair-loop-fr \
            --case nls-stat-long-raw-fr \
            --case nls-stat-quiet-notdir-fr \
            --case nls-group-peer-stops-de \
            --case nls-group-peer-parallel-stops-ja \
            --case nls-suffix-prerequisites-inline-de \
            --case nls-suffix-prerequisites-secondary-ja \
            --case nls-library-pattern-multiple-raw-fr \
            --case nls-library-pattern-single-ja \
            --case nls-group-membership-raw-fr \
            --case nls-group-membership-overlap-ja
          for kind in debug release; do
            python3 tools/nls_diagnostics.py "$@" --candidate "target/$kind/rmake" \
              --locale-root .tools/locale-data-arm64 \
              --report "artifacts/locales/aarch64-build-diagnostics-$kind.json"
          done
      - name: Check localized parser and stdin diagnostics
        timeout-minutes: 3
        run: |
          set -- \
            --case nls-static-target-mismatch-raw-order-ja \
            --case nls-group-recipe-required-conditional-before-home-pl \
            --case nls-builtin-arity-direct-word-de \
            --case nls-builtin-arity-direct-word-fr \
            --case nls-builtin-arity-call-wordlist-pl \
            --case nls-mixed-pattern-fr-file-normal \
            --case nls-mixed-pattern-ja-eval-static \
            --case nls-deprecated-mixed-rule-fr-file-two \
            --case nls-deprecated-mixed-rule-ja-eval-one \
            --case nls-deprecated-mixed-rule-fr-eval-valid-explicit \
            --case nls-missing-inline-rule-c-file-only-semicolon \
            --case nls-missing-inline-rule-de-eval-missing \
            --case nls-missing-inline-rule-ja-file-missing \
            --case nls-missing-inline-rule-fr-file-recipe-prefix \
            --case nls-stdin-unlink-ordinary-raw-fr \
            --case nls-stdin-unlink-fatal-ja \
            --case nls-stdin-unlink-fatal-raw-pl \
            --case nls-stdin-unlink-help-fr
          for kind in debug release; do
            python3 tools/nls_diagnostics.py "$@" --candidate "target/$kind/rmake" \
              --locale-root .tools/locale-data-arm64 \
              --report "artifacts/locales/aarch64-parser-stdin-$kind.json"
            python3 tools/resource_file_size.py --localized --candidate "target/$kind/rmake" \
              --locale-root .tools/locale-data-arm64 \
              --report "artifacts/locales/aarch64-stdin-file-size-$kind.json"
          done
      - name: Check the pinned xxHash and Lua projects
        timeout-minutes: 5
        run: |
          python3 tools/integration.py --case xxhash-0.8.3 --candidate target/release/rmake \
            --report artifacts/integration/aarch64-xxhash-optimized.json
          python3 tools/integration.py --case lua-5.4.9 --case lua-5.4.9-parallel-fifo \
            --candidate target/release/rmake --report artifacts/integration/aarch64-lua-optimized.json
      - name: Check the Guile-enabled application
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tools
        run: |
          sdk=.tools/guile-aarch64
          profile="$sdk/reference-profile.json"
          reports=artifacts/guile-aarch64
          mkdir -p "$reports"
          python3 tools/guile_toolchain.py --root "$sdk" --reference
          target=$(mktemp -d "$RUNNER_TEMP/rmake-guile-aarch64.XXXXXX")
          trap 'rm -rf -- "$target"' EXIT
          export CARGO_TARGET_DIR="$target"
          python3 tools/guile_profile_exec.py --profile "$profile" -- \
            python3 tools/rust.py cargo build --release --locked -p rmake --features guile
          candidate="$target/release/rmake"
          python3 - "$profile" "$candidate" "$reports/identity.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import tempfile

          from conformance import executable_identity, sha256_file
          from guile_frontend import read_profile
          from guile_toolchain import run

          profile_path, candidate, report = map(Path, sys.argv[1:])
          profile = read_profile(profile_path)
          environment = profile['environment']
          commit = run(['git', 'rev-parse', 'HEAD'], timeout=10).stdout.strip().decode()
          assert commit == os.environ['GITHUB_SHA']
          header = run(['readelf', '-h', str(candidate)], env=environment, timeout=10).stdout
          assert any(line.split() == [b'Machine:', b'AArch64'] for line in header.splitlines())

          library = Path(environment['LD_LIBRARY_PATH']).resolve()
          expected = {'libguile-3.0.so.1', 'libgc.so.1'}
          linked = {}
          dependencies = run(['ldd', str(candidate)], env=environment, timeout=10).stdout
          assert b'not found' not in dependencies, dependencies
          for line in dependencies.decode().splitlines():
              name, separator, detail = line.strip().partition(' => ')
              if separator and name in expected:
                  path = Path(detail.split()[0]).resolve(strict=True)
                  assert path.is_relative_to(library), (name, path, library)
                  linked[name] = {'path': str(path), 'sha256': sha256_file(path)}
          assert linked.keys() == expected, dependencies

          source = bytes.fromhex(profile['smoke_input_hex']) + b'$(info HOST=[$(MAKE_HOST)])\n'
          with tempfile.TemporaryDirectory(prefix='rmake-guile-arm-smoke-') as work:
              smoke = run([str(candidate), '-rR', '--no-print-directory', '-f', '-'],
                          cwd=work, env=environment, input=source, timeout=10)
          features, result, host = smoke.stdout.splitlines()
          assert not smoke.stderr and features.startswith(b'FEATURES=[') and features.endswith(b']')
          assert b'guile' in features[10:-1].split() and result == b'RESULT=[42]'
          assert host == b'HOST=[aarch64-unknown-linux-gnu]'
          report.write_text(json.dumps({
              'source_commit': commit,
              'host_machine': platform.machine(),
              'host_libc': platform.libc_ver(),
              'candidate': executable_identity(candidate, environment=environment),
              'reference_profile_sha256': sha256_file(profile_path),
              'elf_header': header.decode(),
              'guile_runtime': linked,
              'smoke_stdout_hex': smoke.stdout.hex(),
              'smoke_stderr_hex': smoke.stderr.hex(),
          }, indent=2) + '\n')
          PY
          python3 tools/guile_frontend.py --profile "$profile" --candidate "$candidate" \
            --locale-root .tools/locale-data-arm64 \
            --case guile-frontend-integer \
            --case c-valid-utf8-source --case utf8-valid-utf8-source --case callback-eval-false \
            --case module-public-interface --case module-public-gmk-var \
            --case guile-bridge-shell-target \
            --case guile-live-converter-result --case guile-live-converter-expand \
            --case guile-live-converter-evaluate --case guile-live-converter-variable \
            --case guile-live-converter-between-leaves \
            --case guile-gmk-var-procedure-shape --case guile-gmk-var-module-scope \
            --case guile-gmk-var-expand-rebound \
            --case guile-gmk-var-expand-rebound-during-conversion \
            --case guile-gmk-var-formatter-rebound-during-conversion \
            --report "$reports/application.json"
          env -u RMAKE_GUILE_COMPONENT_CASE TMPDIR="$target" \
            python3 tools/guile_profile_exec.py --profile "$profile" -- \
            python3 tools/rust.py cargo test --release --locked -p rmake-linux --features guile \
            --test guile_dispatcher -- --native-abi 2>&1 | tee "$reports/components.log"
          du -sb -- "$sdk" "$target" > "$reports/disk-bytes.txt"
      - name: Retain native profile and reports
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-aarch64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .tools/oracle/profile.json
            .tools/guile-aarch64/profile.json
            .tools/guile-aarch64/reference-profile.json
            .tools/guile-aarch64/references/*-build.log
            .tools/guile-aarch64/provenance/signature-status.txt
            .tools/guile-aarch64/provenance/*.package
            artifacts/developer-flows/
            artifacts/evaluation-aarch64/
            artifacts/file-owner-aarch64/
            artifacts/guile-aarch64/
            artifacts/locales/aarch64-*.json
            artifacts/integration/
            artifacts/process-restarts/
            artifacts/restart-pipe/
            artifacts/native/
            artifacts/jobserver/interop-*/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
